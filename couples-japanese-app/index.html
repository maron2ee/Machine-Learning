<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 둘이 일본어 - 커플 일본어 학습</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fff0f3 0%, #fff9f0 50%, #f0f4ff 100%);
      min-height: 100vh;
      color: #333;
    }
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }

    /* Navigation */
    .nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: white;
      border-top: 1px solid #ffe0e6;
      display: flex; justify-content: space-around;
      padding: 8px 0 12px;
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(255,105,135,0.1);
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center;
      background: none; border: none; cursor: pointer;
      color: #ccc; font-size: 11px; gap: 4px; padding: 4px 12px;
      transition: all 0.2s;
    }
    .nav-btn.active { color: #ff6987; }
    .nav-btn .icon { font-size: 22px; }

    /* Header */
    .header {
      background: linear-gradient(135deg, #ff6987, #ff9f6b);
      color: white;
      padding: 16px 20px 14px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 15px rgba(255,105,135,0.3);
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header .subtitle { font-size: 12px; opacity: 0.85; }

    /* Scrollable content */
    .content { padding: 16px; padding-bottom: 80px; }

    /* Cards */
    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    /* Buttons */
    .btn {
      border: none; cursor: pointer; border-radius: 14px;
      font-size: 15px; font-weight: 600; transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff6987, #ff9f6b);
      color: white; padding: 14px 24px; width: 100%;
      box-shadow: 0 4px 15px rgba(255,105,135,0.4);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,105,135,0.5); }
    .btn-secondary {
      background: #fff0f3; color: #ff6987;
      padding: 10px 20px; border: 2px solid #ffccd5;
    }
    .btn-outline {
      background: white; color: #666; padding: 10px 20px;
      border: 2px solid #eee;
    }

    /* Setup screen */
    .setup-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      padding: 30px 24px; text-align: center;
    }
    .setup-logo { font-size: 72px; margin-bottom: 16px; }
    .setup-title { font-size: 26px; font-weight: 700; color: #ff6987; margin-bottom: 8px; }
    .setup-subtitle { color: #888; font-size: 15px; margin-bottom: 36px; }
    .setup-label { font-size: 13px; color: #666; margin-bottom: 6px; text-align: left; font-weight: 600; }
    .setup-input {
      width: 100%; padding: 14px 18px; border-radius: 14px;
      border: 2px solid #ffe0e6; font-size: 16px;
      outline: none; margin-bottom: 16px;
      transition: border 0.2s;
    }
    .setup-input:focus { border-color: #ff6987; }

    /* Flashcard */
    .flashcard-container { perspective: 1000px; height: 220px; margin: 10px 0; }
    .flashcard {
      width: 100%; height: 100%; position: relative;
      transform-style: preserve-3d; transition: transform 0.5s;
      cursor: pointer;
    }
    .flashcard.flipped { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
      position: absolute; width: 100%; height: 100%;
      border-radius: 20px; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      backface-visibility: hidden;
    }
    .flashcard-front {
      background: linear-gradient(135deg, #ff6987, #ff9f6b);
      color: white;
    }
    .flashcard-back {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; transform: rotateY(180deg);
    }
    .card-kana { font-size: 72px; margin-bottom: 8px; }
    .card-label { font-size: 13px; opacity: 0.8; }
    .card-romaji { font-size: 36px; font-weight: 700; margin-bottom: 8px; }
    .card-meaning { font-size: 20px; }

    /* Progress bars */
    .progress-bar {
      height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, #ff6987, #ff9f6b);
      transition: width 0.4s ease;
    }

    /* Partner scores */
    .partner-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
    }
    .partner-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    /* Quiz */
    .quiz-question {
      text-align: center; padding: 20px;
      font-size: 52px; margin: 10px 0;
    }
    .quiz-question-text { font-size: 16px; color: #666; margin-bottom: 8px; }
    .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .quiz-option {
      padding: 16px 10px; border-radius: 14px;
      border: 2px solid #eee; background: white;
      font-size: 16px; cursor: pointer; transition: all 0.2s;
      font-weight: 500;
    }
    .quiz-option:hover { border-color: #ff6987; background: #fff0f3; }
    .quiz-option.correct { background: #e8f8e8; border-color: #4caf50; color: #2e7d32; }
    .quiz-option.wrong { background: #fde8e8; border-color: #f44336; color: #c62828; }
    .quiz-option:disabled { cursor: not-allowed; }

    /* Vocab grid */
    .vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .vocab-card {
      background: white; border-radius: 16px; padding: 16px 12px;
      text-align: center; cursor: pointer; transition: all 0.2s;
      border: 2px solid #ffe0e6;
    }
    .vocab-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,105,135,0.2); }
    .vocab-kana { font-size: 28px; margin-bottom: 4px; }
    .vocab-korean { font-size: 13px; color: #666; }
    .vocab-romaji { font-size: 11px; color: #aaa; }

    /* Category tabs */
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      white-space: nowrap; padding: 8px 16px; border-radius: 20px;
      border: 2px solid #ffe0e6; background: white;
      font-size: 13px; cursor: pointer; transition: all 0.2s; font-weight: 500;
    }
    .tab.active { background: #ff6987; color: white; border-color: #ff6987; }

    /* Badge */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .badge-pink { background: #fff0f3; color: #ff6987; }
    .badge-blue { background: #f0f4ff; color: #667eea; }
    .badge-green { background: #e8f8e8; color: #4caf50; }

    /* Heart animation */
    @keyframes heartbeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
    .heartbeat { animation: heartbeat 1.5s ease-in-out infinite; display: inline-block; }

    /* Streak flame */
    .streak-box {
      display: flex; flex-direction: column; align-items: center;
      background: linear-gradient(135deg, #ff6987, #ff9f6b);
      border-radius: 16px; padding: 16px; color: white;
    }

    /* Category icon cards */
    .cat-card {
      background: white; border-radius: 16px; padding: 18px 14px;
      text-align: center; cursor: pointer; border: 2px solid #ffe0e6;
      transition: all 0.2s;
    }
    .cat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(255,105,135,0.2); }
    .cat-icon { font-size: 36px; margin-bottom: 8px; }
    .cat-name { font-size: 13px; font-weight: 600; color: #555; }
    .cat-count { font-size: 11px; color: #aaa; margin-top: 2px; }

    /* Today word */
    .today-word {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 20px; padding: 20px; color: white; text-align: center;
    }
    .today-label { font-size: 12px; opacity: 0.8; margin-bottom: 8px; }
    .today-kana { font-size: 52px; margin-bottom: 8px; }
    .today-korean { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .today-romaji { font-size: 14px; opacity: 0.8; }

    /* Score display */
    .score-display {
      display: flex; justify-content: space-around; text-align: center;
    }
    .score-num { font-size: 32px; font-weight: 700; color: #ff6987; }
    .score-label { font-size: 12px; color: #888; }

    /* Notification toast */
    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: #333; color: white; padding: 12px 24px; border-radius: 14px;
      font-size: 14px; z-index: 999; opacity: 0;
      transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }

    /* Hiragana table */
    .hira-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    }
    .hira-cell {
      background: white; border-radius: 12px; padding: 12px 6px;
      text-align: center; border: 2px solid #ffe0e6; cursor: pointer;
      transition: all 0.2s;
    }
    .hira-cell:hover, .hira-cell.learned { background: #ff6987; color: white; border-color: #ff6987; }
    .hira-char { font-size: 24px; }
    .hira-roma { font-size: 10px; color: inherit; margin-top: 2px; opacity: 0.7; }
    .section-title { font-size: 17px; font-weight: 700; color: #333; margin-bottom: 12px; }

    input[type="text"] { font-family: inherit; }
    button { font-family: inherit; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ─── Data ──────────────────────────────────────────────────────────────────
const HIRAGANA = [
  {char:'あ',rom:'a'},{char:'い',rom:'i'},{char:'う',rom:'u'},{char:'え',rom:'e'},{char:'お',rom:'o'},
  {char:'か',rom:'ka'},{char:'き',rom:'ki'},{char:'く',rom:'ku'},{char:'け',rom:'ke'},{char:'こ',rom:'ko'},
  {char:'さ',rom:'sa'},{char:'し',rom:'shi'},{char:'す',rom:'su'},{char:'せ',rom:'se'},{char:'そ',rom:'so'},
  {char:'た',rom:'ta'},{char:'ち',rom:'chi'},{char:'つ',rom:'tsu'},{char:'て',rom:'te'},{char:'と',rom:'to'},
  {char:'な',rom:'na'},{char:'に',rom:'ni'},{char:'ぬ',rom:'nu'},{char:'ね',rom:'ne'},{char:'の',rom:'no'},
  {char:'は',rom:'ha'},{char:'ひ',rom:'hi'},{char:'ふ',rom:'fu'},{char:'へ',rom:'he'},{char:'ほ',rom:'ho'},
  {char:'ま',rom:'ma'},{char:'み',rom:'mi'},{char:'む',rom:'mu'},{char:'め',rom:'me'},{char:'も',rom:'mo'},
  {char:'や',rom:'ya'},{char:'',rom:''},{char:'ゆ',rom:'yu'},{char:'',rom:''},{char:'よ',rom:'yo'},
  {char:'ら',rom:'ra'},{char:'り',rom:'ri'},{char:'る',rom:'ru'},{char:'れ',rom:'re'},{char:'ろ',rom:'ro'},
  {char:'わ',rom:'wa'},{char:'',rom:''},{char:'を',rom:'wo'},{char:'',rom:''},{char:'ん',rom:'n'},
];

const VOCAB_CATEGORIES = {
  '일상': [
    {kana:'おはよう',korean:'안녕 (아침)',romaji:'ohayou'},
    {kana:'こんにちは',korean:'안녕하세요',romaji:'konnichiwa'},
    {kana:'こんばんは',korean:'안녕하세요 (저녁)',romaji:'konbanwa'},
    {kana:'ありがとう',korean:'고마워',romaji:'arigatou'},
    {kana:'すみません',korean:'저기요 / 죄송해요',romaji:'sumimasen'},
    {kana:'はい',korean:'네',romaji:'hai'},
    {kana:'いいえ',korean:'아니오',romaji:'iie'},
    {kana:'わかりました',korean:'알겠어요',romaji:'wakarimashita'},
  ],
  '사랑': [
    {kana:'すき',korean:'좋아해',romaji:'suki'},
    {kana:'あいしてる',korean:'사랑해',romaji:'aishiteru'},
    {kana:'かわいい',korean:'귀여워',romaji:'kawaii'},
    {kana:'いっしょにいよう',korean:'같이 있자',romaji:'issho ni iyou'},
    {kana:'てをつなごう',korean:'손 잡자',romaji:'te wo tsunagou'},
    {kana:'たのしい',korean:'즐거워',romaji:'tanoshii'},
    {kana:'しあわせ',korean:'행복해',romaji:'shiawase'},
    {kana:'ずっといっしょ',korean:'항상 같이',romaji:'zutto issho'},
  ],
  '음식': [
    {kana:'おいしい',korean:'맛있어',romaji:'oishii'},
    {kana:'ラーメン',korean:'라멘',romaji:'raamen'},
    {kana:'すし',korean:'초밥',romaji:'sushi'},
    {kana:'てんぷら',korean:'튀김',romaji:'tenpura'},
    {kana:'やきとり',korean:'야키토리',romaji:'yakitori'},
    {kana:'おちゃ',korean:'녹차',romaji:'ocha'},
    {kana:'たべよう',korean:'먹자',romaji:'tabeyou'},
    {kana:'のもう',korean:'마시자',romaji:'nomou'},
  ],
  '여행': [
    {kana:'どこ',korean:'어디',romaji:'doko'},
    {kana:'えき',korean:'역',romaji:'eki'},
    {kana:'ホテル',korean:'호텔',romaji:'hoteru'},
    {kana:'かいもの',korean:'쇼핑',romaji:'kaimono'},
    {kana:'しゃしん',korean:'사진',romaji:'shashin'},
    {kana:'たのしかった',korean:'즐거웠어',romaji:'tanoshikatta'},
    {kana:'きれい',korean:'예뻐 / 아름다워',romaji:'kirei'},
    {kana:'またきたい',korean:'또 오고 싶어',romaji:'mata kitai'},
  ],
};

const ALL_VOCAB = Object.values(VOCAB_CATEGORIES).flat();

const CATEGORY_ICONS = { '일상': '🌸', '사랑': '💕', '음식': '🍣', '여행': '✈️' };

function getTodayWord() {
  const day = Math.floor(Date.now() / 86400000);
  return ALL_VOCAB[day % ALL_VOCAB.length];
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ─── LocalStorage helpers ──────────────────────────────────────────────────
function loadState() {
  try { return JSON.parse(localStorage.getItem('jpCouple') || 'null'); } catch { return null; }
}
function saveState(s) {
  localStorage.setItem('jpCouple', JSON.stringify(s));
}

// ─── Toast ─────────────────────────────────────────────────────────────────
function Toast({ msg }) {
  return msg ? <div className={`toast show`}>{msg}</div> : null;
}

// ─── Setup Screen ──────────────────────────────────────────────────────────
function SetupScreen({ onComplete }) {
  const [p1, setP1] = useState('');
  const [p2, setP2] = useState('');
  return (
    <div className="setup-screen">
      <div className="setup-logo">💑</div>
      <h1 className="setup-title">우리 둘이 일본어</h1>
      <p className="setup-subtitle">함께 배우면 더 재밌어요! 두 분의 이름을 입력해주세요</p>

      <div style={{width:'100%', maxWidth:340}}>
        <div className="setup-label">👩 첫 번째 파트너</div>
        <input
          className="setup-input"
          placeholder="이름 또는 닉네임"
          value={p1} onChange={e => setP1(e.target.value)}
        />
        <div className="setup-label">👨 두 번째 파트너</div>
        <input
          className="setup-input"
          placeholder="이름 또는 닉네임"
          value={p2} onChange={e => setP2(e.target.value)}
        />
        <button
          className="btn btn-primary"
          style={{marginTop:8}}
          disabled={!p1.trim() || !p2.trim()}
          onClick={() => onComplete(p1.trim(), p2.trim())}
        >
          일본어 여행 시작하기 🌸
        </button>
      </div>
    </div>
  );
}

// ─── Home Tab ──────────────────────────────────────────────────────────────
function HomeTab({ state, setState }) {
  const todayWord = getTodayWord();
  const totalVocab = ALL_VOCAB.length;
  const p1Learned = state.learned.filter(k => state.p1Learned?.includes(k)).length;
  const p2Learned = state.learned.filter(k => state.p2Learned?.includes(k)).length;

  return (
    <div className="content">
      {/* Header greeting */}
      <div className="card" style={{background:'linear-gradient(135deg,#ff6987,#ff9f6b)',color:'white'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontSize:13,opacity:0.85,marginBottom:4}}>오늘도 함께 공부해요 💕</div>
            <div style={{fontSize:20,fontWeight:700}}>{state.p1} & {state.p2}</div>
          </div>
          <div style={{fontSize:48}}>🌸</div>
        </div>
      </div>

      {/* Streak */}
      <div className="card">
        <div style={{display:'flex',justifyContent:'space-around',textAlign:'center'}}>
          <div>
            <div style={{fontSize:28,fontWeight:700,color:'#ff6987'}}>{state.streak || 0}</div>
            <div style={{fontSize:12,color:'#888'}}>🔥 연속 학습일</div>
          </div>
          <div>
            <div style={{fontSize:28,fontWeight:700,color:'#667eea'}}>{state.learned?.length || 0}</div>
            <div style={{fontSize:12,color:'#888'}}>📚 배운 단어</div>
          </div>
          <div>
            <div style={{fontSize:28,fontWeight:700,color:'#4caf50'}}>{state.quizWins || 0}</div>
            <div style={{fontSize:12,color:'#888'}}>🏆 퀴즈 승리</div>
          </div>
        </div>
      </div>

      {/* Today's word */}
      <div style={{marginBottom:14}}>
        <div className="section-title">오늘의 단어 ✨</div>
        <div className="today-word">
          <div className="today-label">오늘 꼭 외워봐요!</div>
          <div className="today-kana">{todayWord.kana}</div>
          <div className="today-korean">{todayWord.korean}</div>
          <div className="today-romaji">{todayWord.romaji}</div>
        </div>
      </div>

      {/* Partner progress */}
      <div style={{marginBottom:14}}>
        <div className="section-title">파트너 진도 현황</div>
        <div className="card">
          {[
            {name: state.p1, avatar:'👩', learned: state.p1Learned?.length || 0, color:'#ff6987'},
            {name: state.p2, avatar:'👨', learned: state.p2Learned?.length || 0, color:'#667eea'},
          ].map(p => (
            <div key={p.name} style={{marginBottom:12}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:20}}>{p.avatar}</span>
                  <span style={{fontWeight:600}}>{p.name}</span>
                </div>
                <span style={{fontSize:13,color:'#888'}}>{p.learned} / {totalVocab} 단어</span>
              </div>
              <div className="progress-bar">
                <div className="progress-fill" style={{
                  width:`${(p.learned/totalVocab)*100}%`,
                  background:`linear-gradient(90deg, ${p.color}, ${p.color}cc)`
                }}/>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Quick tips */}
      <div className="card" style={{background:'#f0f4ff'}}>
        <div style={{fontSize:14,color:'#667eea',fontWeight:600,marginBottom:8}}>💡 오늘의 팁</div>
        <div style={{fontSize:13,color:'#555',lineHeight:1.6}}>
          파트너와 함께 퀴즈 배틀을 해보세요! 경쟁하면서 배우면 두 배로 빠르게 외울 수 있어요 🏆
        </div>
      </div>
    </div>
  );
}

// ─── Vocab Tab ─────────────────────────────────────────────────────────────
function VocabTab({ state, setState }) {
  const [activeCat, setActiveCat] = useState('일상');
  const [flipped, setFlipped] = useState(null);
  const [cardIdx, setCardIdx] = useState(0);
  const [mode, setMode] = useState('grid'); // 'grid' | 'card'

  const words = VOCAB_CATEGORIES[activeCat] || [];
  const word = words[cardIdx];

  const markLearned = (kana, partner) => {
    const key = partner === 1 ? 'p1Learned' : 'p2Learned';
    const current = state[key] || [];
    if (!current.includes(kana)) {
      const next = { ...state, [key]: [...current, kana] };
      if (!state.learned?.includes(kana)) next.learned = [...(state.learned || []), kana];
      setState(next);
    }
  };

  return (
    <div className="content">
      <div className="section-title">어휘 학습 📖</div>

      {/* Mode toggle */}
      <div style={{display:'flex',gap:8,marginBottom:14}}>
        <button className={`btn ${mode==='grid'?'btn-primary':'btn-outline'}`}
          style={{flex:1,padding:'10px'}}
          onClick={() => setMode('grid')}>목록 보기</button>
        <button className={`btn ${mode==='card'?'btn-primary':'btn-outline'}`}
          style={{flex:1,padding:'10px'}}
          onClick={() => { setMode('card'); setCardIdx(0); setFlipped(false); }}>카드 학습</button>
      </div>

      {/* Category tabs */}
      <div className="tabs" style={{marginBottom:16}}>
        {Object.keys(VOCAB_CATEGORIES).map(cat => (
          <button key={cat} className={`tab ${activeCat===cat?'active':''}`}
            onClick={() => { setActiveCat(cat); setCardIdx(0); setFlipped(false); }}>
            {CATEGORY_ICONS[cat]} {cat}
          </button>
        ))}
      </div>

      {mode === 'grid' ? (
        <div className="vocab-grid">
          {words.map((w, i) => {
            const p1has = state.p1Learned?.includes(w.kana);
            const p2has = state.p2Learned?.includes(w.kana);
            return (
              <div key={i} className="vocab-card" onClick={() => setFlipped(flipped===i?null:i)}>
                <div className="vocab-kana">{w.kana}</div>
                {flipped === i ? (
                  <>
                    <div className="vocab-korean" style={{fontWeight:600,color:'#333'}}>{w.korean}</div>
                    <div className="vocab-romaji">{w.romaji}</div>
                    <div style={{display:'flex',gap:4,justifyContent:'center',marginTop:8}}>
                      <button className="btn btn-secondary" style={{padding:'4px 8px',fontSize:11}}
                        onClick={e=>{e.stopPropagation();markLearned(w.kana,1);}}>
                        {p1has?'✓':''} {state.p1}
                      </button>
                      <button className="btn" style={{padding:'4px 8px',fontSize:11,background:'#f0f4ff',color:'#667eea',border:'2px solid #d0d8ff',borderRadius:14}}
                        onClick={e=>{e.stopPropagation();markLearned(w.kana,2);}}>
                        {p2has?'✓':''} {state.p2}
                      </button>
                    </div>
                  </>
                ) : (
                  <div style={{display:'flex',gap:4,justifyContent:'center',marginTop:6}}>
                    {p1has && <span style={{fontSize:10,color:'#ff6987'}}>👩✓</span>}
                    {p2has && <span style={{fontSize:10,color:'#667eea'}}>👨✓</span>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ) : (
        <div>
          {/* Flashcard */}
          <div className="flashcard-container" onClick={() => setFlipped(!flipped)}>
            <div className={`flashcard ${flipped?'flipped':''}`}>
              <div className="flashcard-front">
                <div style={{fontSize:11,opacity:0.7,marginBottom:8}}>탭하면 뒤집어요!</div>
                <div className="card-kana">{word?.kana}</div>
                <div className="card-label">{activeCat} 어휘</div>
              </div>
              <div className="flashcard-back">
                <div className="card-romaji">{word?.romaji}</div>
                <div className="card-meaning">{word?.korean}</div>
              </div>
            </div>
          </div>

          {/* Controls */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',margin:'14px 0'}}>
            <button className="btn btn-outline" style={{padding:'10px 20px'}}
              onClick={() => { setCardIdx((cardIdx-1+words.length)%words.length); setFlipped(false); }}>
              ← 이전
            </button>
            <span style={{color:'#888',fontSize:13}}>{cardIdx+1} / {words.length}</span>
            <button className="btn btn-outline" style={{padding:'10px 20px'}}
              onClick={() => { setCardIdx((cardIdx+1)%words.length); setFlipped(false); }}>
              다음 →
            </button>
          </div>

          {/* Mark learned */}
          {flipped && (
            <div className="card" style={{background:'#f9f9f9'}}>
              <div style={{fontSize:13,color:'#666',marginBottom:10,textAlign:'center'}}>외웠나요? 체크해주세요!</div>
              <div style={{display:'flex',gap:10}}>
                <button className="btn btn-secondary" style={{flex:1,padding:'12px'}}
                  onClick={() => markLearned(word.kana, 1)}>
                  👩 {state.p1} {state.p1Learned?.includes(word.kana)?'✓ 완료':'외웠어요!'}
                </button>
                <button className="btn" style={{flex:1,padding:'12px',background:'#f0f4ff',color:'#667eea',border:'2px solid #d0d8ff',borderRadius:14}}
                  onClick={() => markLearned(word.kana, 2)}>
                  👨 {state.p2} {state.p2Learned?.includes(word.kana)?'✓ 완료':'외웠어요!'}
                </button>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── Quiz Tab ──────────────────────────────────────────────────────────────
function QuizTab({ state, setState, showToast }) {
  const [quizState, setQuizState] = useState('intro'); // intro | playing | result
  const [currentPlayer, setCurrentPlayer] = useState(1);
  const [scores, setScores] = useState({1:0, 2:0});
  const [round, setRound] = useState(0);
  const [totalRounds] = useState(10);
  const [questions, setQuestions] = useState([]);
  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState(false);

  const startQuiz = () => {
    const pool = shuffle(ALL_VOCAB).slice(0, totalRounds);
    const qs = pool.map(word => {
      const wrongs = shuffle(ALL_VOCAB.filter(w => w.kana !== word.kana)).slice(0,3);
      const options = shuffle([word, ...wrongs]);
      return { word, options };
    });
    setQuestions(qs);
    setRound(0);
    setScores({1:0, 2:0});
    setCurrentPlayer(1);
    setSelected(null);
    setAnswered(false);
    setQuizState('playing');
  };

  const q = questions[round];

  const handleAnswer = (opt) => {
    if (answered) return;
    setSelected(opt);
    setAnswered(true);
    if (opt.kana === q.word.kana) {
      setScores(s => ({ ...s, [currentPlayer]: s[currentPlayer] + 1 }));
      showToast('정답! 🎉');
    } else {
      showToast('아쉬워요 😅');
    }
    setTimeout(() => {
      if (round + 1 >= totalRounds) {
        setQuizState('result');
      } else {
        setRound(r => r+1);
        setCurrentPlayer(p => p === 1 ? 2 : 1);
        setSelected(null);
        setAnswered(false);
      }
    }, 1200);
  };

  const saveResult = () => {
    const winner = scores[1] > scores[2] ? 1 : scores[2] > scores[1] ? 2 : 0;
    const wins = winner > 0 ? (state.quizWins || 0) + 1 : (state.quizWins || 0);
    setState({ ...state, quizWins: wins });
  };

  if (quizState === 'intro') return (
    <div className="content">
      <div className="section-title">커플 퀴즈 배틀 🏆</div>
      <div className="card" style={{textAlign:'center',padding:28}}>
        <div style={{fontSize:64,marginBottom:16}}>🎮</div>
        <div style={{fontSize:18,fontWeight:700,marginBottom:8}}>퀴즈 배틀</div>
        <div style={{fontSize:14,color:'#888',marginBottom:24,lineHeight:1.7}}>
          번갈아가며 문제를 풀어요!<br/>
          {state.p1}와 {state.p2} 중 누가 더 많이 맞힐까요?<br/>
          총 {10}문제 출제됩니다 🌸
        </div>
        <button className="btn btn-primary" onClick={startQuiz}>배틀 시작! ⚔️</button>
      </div>

      {/* Rules */}
      <div className="card">
        <div style={{fontSize:14,fontWeight:600,marginBottom:10}}>게임 방법</div>
        {[
          '일본어 단어를 보고 뜻을 고르세요',
          '번갈아가며 문제를 풀어요',
          '맞히면 1점, 틀리면 0점',
          '10문제 후 최고 점수자가 승리!',
        ].map((rule, i) => (
          <div key={i} style={{display:'flex',gap:10,marginBottom:8,fontSize:13,color:'#555'}}>
            <span style={{color:'#ff6987',fontWeight:700}}>{i+1}.</span>
            <span>{rule}</span>
          </div>
        ))}
      </div>
    </div>
  );

  if (quizState === 'result') {
    const winner = scores[1] > scores[2] ? state.p1 : scores[2] > scores[1] ? state.p2 : null;
    return (
      <div className="content">
        <div className="section-title">결과 발표 🎊</div>
        <div className="card" style={{textAlign:'center',padding:28}}>
          <div style={{fontSize:64,marginBottom:12}}>
            {winner ? '🏆' : '🤝'}
          </div>
          <div style={{fontSize:20,fontWeight:700,marginBottom:8}}>
            {winner ? `${winner} 승리!` : '무승부!'}
          </div>
          <div style={{fontSize:14,color:'#888',marginBottom:24}}>
            {winner ? `축하해요! 잘했어요 🎉` : '두 분 다 잘하셨어요!'}
          </div>

          <div className="score-display" style={{marginBottom:24}}>
            <div>
              <div style={{fontSize:13,color:'#888',marginBottom:4}}>👩 {state.p1}</div>
              <div style={{fontSize:40,fontWeight:700,color:'#ff6987'}}>{scores[1]}</div>
            </div>
            <div style={{fontSize:24,color:'#ccc',alignSelf:'center'}}>VS</div>
            <div>
              <div style={{fontSize:13,color:'#888',marginBottom:4}}>👨 {state.p2}</div>
              <div style={{fontSize:40,fontWeight:700,color:'#667eea'}}>{scores[2]}</div>
            </div>
          </div>

          <div style={{display:'flex',gap:10}}>
            <button className="btn btn-secondary" style={{flex:1,padding:'12px'}}
              onClick={() => { saveResult(); setQuizState('intro'); }}>
              홈으로
            </button>
            <button className="btn btn-primary" style={{flex:1,padding:'12px'}}
              onClick={() => { saveResult(); startQuiz(); }}>
              다시 도전!
            </button>
          </div>
        </div>
      </div>
    );
  }

  // Playing
  const player = currentPlayer === 1 ? state.p1 : state.p2;
  const playerColor = currentPlayer === 1 ? '#ff6987' : '#667eea';
  const playerIcon = currentPlayer === 1 ? '👩' : '👨';

  return (
    <div className="content">
      {/* Score header */}
      <div className="card" style={{background:`linear-gradient(135deg,${playerColor},${playerColor}bb)`,color:'white',padding:16}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:11,opacity:0.8}}>👩 {state.p1}</div>
            <div style={{fontSize:28,fontWeight:700}}>{scores[1]}</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:12,opacity:0.8}}>문제 {round+1}/{totalRounds}</div>
            <div style={{fontSize:11,marginTop:4}}>{playerIcon} {player}의 차례</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:11,opacity:0.8}}>👨 {state.p2}</div>
            <div style={{fontSize:28,fontWeight:700}}>{scores[2]}</div>
          </div>
        </div>
      </div>

      {/* Question */}
      <div className="card" style={{textAlign:'center',padding:24}}>
        <div style={{fontSize:13,color:'#888',marginBottom:4}}>이 단어의 뜻은?</div>
        <div className="quiz-question">{q?.word.kana}</div>
        <div style={{fontSize:12,color:'#aaa'}}>{q?.word.romaji}</div>
      </div>

      {/* Options */}
      <div className="quiz-options">
        {q?.options.map((opt, i) => {
          let cls = 'quiz-option';
          if (answered) {
            if (opt.kana === q.word.kana) cls += ' correct';
            else if (selected?.kana === opt.kana) cls += ' wrong';
          }
          return (
            <button key={i} className={cls} onClick={() => handleAnswer(opt)} disabled={answered}>
              {opt.korean}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ─── Hiragana Tab ──────────────────────────────────────────────────────────
function HiraganaTab({ state, setState, showToast }) {
  const learnedSet = new Set(state.hiragana || []);

  const toggle = (char) => {
    if (!char) return;
    const current = new Set(state.hiragana || []);
    if (current.has(char)) current.delete(char);
    else { current.add(char); showToast(`${char} 완료! 🌸`); }
    setState({ ...state, hiragana: [...current] });
  };

  const pct = Math.round((learnedSet.size / HIRAGANA.filter(h=>h.char).length) * 100);

  return (
    <div className="content">
      <div className="section-title">히라가나 학습 あ</div>

      <div className="card" style={{marginBottom:14}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
          <span style={{fontSize:13,fontWeight:600}}>학습 진도</span>
          <span style={{fontSize:13,color:'#ff6987',fontWeight:600}}>{pct}%</span>
        </div>
        <div className="progress-bar">
          <div className="progress-fill" style={{width:`${pct}%`}}/>
        </div>
        <div style={{fontSize:12,color:'#888',marginTop:8}}>
          {learnedSet.size} / {HIRAGANA.filter(h=>h.char).length} 글자 완료
        </div>
      </div>

      <div className="card">
        <div style={{fontSize:13,color:'#666',marginBottom:12,lineHeight:1.5}}>
          글자를 탭하면 외운 것으로 표시돼요! 파트너와 함께 하나씩 외워봐요 🌸
        </div>
        <div className="hira-grid">
          {HIRAGANA.map((h, i) => (
            h.char ? (
              <div key={i} className={`hira-cell ${learnedSet.has(h.char)?'learned':''}`}
                onClick={() => toggle(h.char)}>
                <div className="hira-char">{h.char}</div>
                <div className="hira-roma">{h.rom}</div>
              </div>
            ) : <div key={i}/>
          ))}
        </div>
      </div>

      <div className="card" style={{background:'#fff9f0',border:'2px solid #ffe0c0'}}>
        <div style={{fontSize:13,fontWeight:600,color:'#ff9f6b',marginBottom:6}}>✏️ 학습 팁</div>
        <div style={{fontSize:12,color:'#666',lineHeight:1.6}}>
          하루에 한 행(5글자)씩 외워보세요.<br/>
          파트너에게 읽어달라고 하고 맞히는 연습을 해보세요!
        </div>
      </div>
    </div>
  );
}

// ─── Main App ──────────────────────────────────────────────────────────────
function App() {
  const [appState, setAppState] = useState(null);
  const [tab, setTab] = useState('home');
  const [toast, setToast] = useState('');

  useEffect(() => {
    const saved = loadState();
    if (saved?.p1 && saved?.p2) setAppState(saved);
  }, []);

  const updateState = useCallback((next) => {
    setAppState(next);
    saveState(next);
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 1800);
  };

  if (!appState?.p1) {
    return <SetupScreen onComplete={(p1, p2) => {
      const s = { p1, p2, streak: 1, learned: [], p1Learned: [], p2Learned: [], quizWins: 0, hiragana: [] };
      updateState(s);
    }} />;
  }

  const tabs = [
    { id: 'home', icon: '🏠', label: '홈' },
    { id: 'vocab', icon: '📖', label: '어휘' },
    { id: 'quiz', icon: '🏆', label: '퀴즈' },
    { id: 'hiragana', icon: 'あ', label: '히라가나' },
  ];

  return (
    <div className="app">
      <Toast msg={toast} />

      {/* Header */}
      <div className="header">
        <div>
          <h1>
            {tab === 'home' ? '우리 둘이 일본어 💑' :
             tab === 'vocab' ? '어휘 학습 📖' :
             tab === 'quiz' ? '퀴즈 배틀 🏆' : '히라가나 あ'}
          </h1>
          <div className="subtitle">{appState.p1} & {appState.p2}</div>
        </div>
        <div className="heartbeat">🌸</div>
      </div>

      {/* Content */}
      {tab === 'home' && <HomeTab state={appState} setState={updateState} />}
      {tab === 'vocab' && <VocabTab state={appState} setState={updateState} />}
      {tab === 'quiz' && <QuizTab state={appState} setState={updateState} showToast={showToast} />}
      {tab === 'hiragana' && <HiraganaTab state={appState} setState={updateState} showToast={showToast} />}

      {/* Bottom Navigation */}
      <nav className="nav">
        {tabs.map(t => (
          <button key={t.id} className={`nav-btn ${tab===t.id?'active':''}`} onClick={() => setTab(t.id)}>
            <span className="icon">{t.icon}</span>
            <span>{t.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
