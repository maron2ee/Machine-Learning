<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="우리 둘이 일본어" />
  <meta name="theme-color" content="#bf3a57" />
  <meta name="description" content="부부가 함께 일본어를 배우는 커플 학습 앱" />
  <link rel="manifest" href="manifest.json" />
  <title>우리 둘이 일본어</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ── Tokens ─────────────────────────────────────────────────────────── */
    :root {
      --bg:        #f5f0eb;
      --surface:   #ffffff;
      --surface-2: #faf7f3;
      --rose:      #bf3a57;
      --rose-lt:   #fceaee;
      --rose-dk:   #8c1f36;
      --plum:      #3a2850;
      --plum-lt:   #ede8f5;
      --ink:       #1a1118;
      --ink-2:     #6b5a70;
      --ink-3:     #aaa0b0;
      --border:    #e6dce4;
      --shadow:    rgba(50,15,40,0.07);
      --ok:        #2e7d4f;
      --ok-lt:     #e8f5ed;
      --err:       #c0392b;
      --err-lt:    #fde8e6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #150f18;
        --surface:   #201720;
        --surface-2: #281e2c;
        --rose:      #e05a75;
        --rose-lt:   #3a1a26;
        --rose-dk:   #f07090;
        --plum:      #9570c0;
        --plum-lt:   #261e36;
        --ink:       #f0eaf5;
        --ink-2:     #b8a8c2;
        --ink-3:     #6e5e7a;
        --border:    #352538;
        --shadow:    rgba(0,0,0,0.3);
        --ok:        #4caf73;
        --ok-lt:     #1a3a27;
        --err:       #e05545;
        --err-lt:    #3a1a18;
      }
    }
    :root[data-theme="light"] {
      --bg:#f5f0eb; --surface:#ffffff; --surface-2:#faf7f3;
      --rose:#bf3a57; --rose-lt:#fceaee; --rose-dk:#8c1f36;
      --plum:#3a2850; --plum-lt:#ede8f5;
      --ink:#1a1118; --ink-2:#6b5a70; --ink-3:#aaa0b0;
      --border:#e6dce4; --shadow:rgba(50,15,40,0.07);
      --ok:#2e7d4f; --ok-lt:#e8f5ed; --err:#c0392b; --err-lt:#fde8e6;
    }
    :root[data-theme="dark"] {
      --bg:#150f18; --surface:#201720; --surface-2:#281e2c;
      --rose:#e05a75; --rose-lt:#3a1a26; --rose-dk:#f07090;
      --plum:#9570c0; --plum-lt:#261e36;
      --ink:#f0eaf5; --ink-2:#b8a8c2; --ink-3:#6e5e7a;
      --border:#352538; --shadow:rgba(0,0,0,0.3);
      --ok:#4caf73; --ok-lt:#1a3a27; --err:#e05545; --err-lt:#3a1a18;
    }

    /* ── Reset & Base ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overscroll-behavior: none;
      transition: background 0.2s, color 0.2s;
    }
    button, input { font-family: inherit; }
    button { cursor: pointer; border: none; background: none; }

    /* ── Layout shell ───────────────────────────────────────────────────── */
    .app {
      max-width: 480px; margin: 0 auto;
      min-height: 100vh; min-height: -webkit-fill-available;
      position: relative; display: flex; flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: calc(14px + env(safe-area-inset-top)) 20px 13px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .header-title {
      font-size: 17px; font-weight: 700; letter-spacing: -0.3px;
      color: var(--ink);
    }
    .header-title span { color: var(--rose); }
    .header-sub {
      font-size: 11px; color: var(--ink-3); margin-top: 1px;
      letter-spacing: 0.2px;
    }
    .header-mark {
      width: 34px; height: 34px;
      border: 1.5px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    /* ── Content ────────────────────────────────────────────────────────── */
    .content {
      flex: 1;
      padding: 20px 16px calc(84px + env(safe-area-inset-bottom));
      overflow-y: auto;
    }

    /* ── Cards ──────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px var(--shadow);
    }
    .card-flat {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    /* ── Buttons ────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; border-radius: 12px;
      font-size: 15px; font-weight: 600;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--rose);
      color: #fff;
      padding: 15px 24px; width: 100%;
      box-shadow: 0 4px 18px rgba(191,58,87,0.35);
      letter-spacing: 0.2px;
    }
    .btn-primary:hover { box-shadow: 0 6px 22px rgba(191,58,87,0.45); }
    .btn-primary:disabled { opacity: 0.4; pointer-events: none; }
    .btn-ghost {
      background: var(--surface-2);
      color: var(--ink-2);
      padding: 10px 18px;
      border: 1px solid var(--border);
    }
    .btn-ghost-rose {
      background: var(--rose-lt);
      color: var(--rose);
      padding: 10px 18px;
      border: 1px solid color-mix(in srgb, var(--rose) 20%, transparent);
    }
    .btn-ghost-plum {
      background: var(--plum-lt);
      color: var(--plum);
      padding: 10px 18px;
      border: 1px solid color-mix(in srgb, var(--plum) 20%, transparent);
    }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }

    /* ── Bottom nav ─────────────────────────────────────────────────────── */
    .nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 8px 8px max(10px, env(safe-area-inset-bottom));
      z-index: 100;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; min-width: 60px; padding: 6px 8px;
      border-radius: 14px; transition: background 0.18s;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-btn.active { background: var(--rose-lt); }
    .nav-icon { font-size: 20px; line-height: 1; }
    .nav-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
      color: var(--ink-3); transition: color 0.18s;
    }
    .nav-btn.active .nav-label { color: var(--rose); }

    /* ── Section headings ───────────────────────────────────────────────── */
    .section-title {
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.6px; text-transform: uppercase;
      color: var(--ink-3); margin-bottom: 10px;
    }

    /* ── Progress bar ───────────────────────────────────────────────────── */
    .prog-track { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .prog-fill {
      height: 100%; border-radius: 3px;
      background: var(--rose);
      transition: width 0.4s ease;
    }

    /* ── Pill tabs ──────────────────────────────────────────────────────── */
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      white-space: nowrap; padding: 7px 15px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
      background: var(--surface-2); color: var(--ink-3);
      border: 1px solid var(--border);
      transition: all 0.18s;
    }
    .tab.active { background: var(--rose); color: #fff; border-color: transparent; }

    /* ── Mode toggle ────────────────────────────────────────────────────── */
    .toggle-wrap {
      display: grid; grid-template-columns: 1fr 1fr;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 16px;
    }
    .toggle-btn {
      padding: 9px; border-radius: 9px; font-size: 14px; font-weight: 600;
      color: var(--ink-3); transition: all 0.18s;
    }
    .toggle-btn.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 6px var(--shadow); }

    /* ── Setup screen ───────────────────────────────────────────────────── */
    .setup-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center;
      min-height: 100vh; min-height: -webkit-fill-available;
      padding: 48px 28px;
      background: var(--bg);
    }
    .setup-mark { margin-bottom: 24px; }
    .setup-kicker {
      font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase;
      color: var(--rose); font-weight: 700; margin-bottom: 8px;
    }
    .setup-title {
      font-family: Georgia, 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      font-size: 28px; font-weight: normal;
      color: var(--ink); line-height: 1.25;
      text-align: center; text-wrap: balance;
      margin-bottom: 6px;
    }
    .setup-ja {
      font-family: Georgia, 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      font-size: 14px; color: var(--ink-3); margin-bottom: 40px;
      letter-spacing: 2px;
    }
    .setup-form { width: 100%; max-width: 340px; }
    .field-group { margin-bottom: 16px; }
    .field-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; color: var(--ink-3); margin-bottom: 7px;
      display: block;
    }
    .field-input {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      color: var(--ink);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    .field-input::placeholder { color: var(--ink-3); }
    .field-input:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px var(--rose-lt);
    }

    /* ── Flashcard ──────────────────────────────────────────────────────── */
    .fc-wrap { perspective: 1200px; height: 230px; margin-bottom: 14px; }
    .fc {
      width: 100%; height: 100%; position: relative;
      transform-style: preserve-3d; transition: transform 0.48s cubic-bezier(.4,0,.2,1);
      cursor: pointer;
    }
    .fc.flipped { transform: rotateY(180deg); }
    .fc-face {
      position: absolute; width: 100%; height: 100%;
      border-radius: 20px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      backface-visibility: hidden;
    }
    .fc-front {
      background: var(--rose);
      color: #fff;
    }
    .fc-back {
      background: var(--plum);
      color: #fff;
      transform: rotateY(180deg);
    }
    .fc-hint { font-size: 11px; opacity: 0.6; margin-bottom: 10px; letter-spacing: 0.5px; }
    .fc-kana {
      font-family: Georgia, 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      font-size: 64px; line-height: 1; margin-bottom: 6px;
    }
    .fc-tag { font-size: 12px; opacity: 0.55; letter-spacing: 0.5px; }
    .fc-romaji { font-size: 32px; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; }
    .fc-meaning { font-size: 20px; opacity: 0.9; }

    /* ── Vocab grid ─────────────────────────────────────────────────────── */
    .vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .vocab-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 16px 10px;
      text-align: center; cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .vocab-card:active { transform: scale(0.97); }
    .vocab-kana {
      font-family: Georgia, 'Hiragino Mincho ProN', serif;
      font-size: 24px; margin-bottom: 5px; color: var(--ink);
    }
    .vocab-korean { font-size: 12px; color: var(--ink-2); font-weight: 500; }
    .vocab-romaji { font-size: 10px; color: var(--ink-3); margin-top: 2px; }
    .vocab-checks { display: flex; gap: 4px; justify-content: center; margin-top: 6px; }
    .v-check {
      font-size: 10px; padding: 2px 6px; border-radius: 6px;
      background: var(--rose-lt); color: var(--rose); font-weight: 600;
    }
    .v-check.plum { background: var(--plum-lt); color: var(--plum); }

    /* ── Today word ─────────────────────────────────────────────────────── */
    .today-card {
      background: var(--plum);
      border-radius: 18px; padding: 24px 20px;
      color: #fff; text-align: center;
      position: relative; overflow: hidden;
    }
    .today-card::before {
      content: '二'; position: absolute;
      font-family: Georgia, serif; font-size: 140px;
      color: rgba(255,255,255,0.04);
      right: -20px; top: -20px; line-height: 1;
      pointer-events: none;
    }
    .today-eyebrow {
      font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
      opacity: 0.55; margin-bottom: 12px; font-weight: 600;
    }
    .today-kana {
      font-family: Georgia, 'Hiragino Mincho ProN', serif;
      font-size: 56px; line-height: 1; margin-bottom: 10px;
    }
    .today-korean { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .today-romaji { font-size: 13px; opacity: 0.55; letter-spacing: 0.5px; }

    /* ── Stat row ───────────────────────────────────────────────────────── */
    .stat-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .stat-tile {
      flex: 1; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 10px; text-align: center;
    }
    .stat-num {
      font-family: Georgia, serif;
      font-size: 28px; font-weight: normal;
      color: var(--rose); line-height: 1; margin-bottom: 4px;
    }
    .stat-label { font-size: 10px; color: var(--ink-3); letter-spacing: 0.4px; font-weight: 600; text-transform: uppercase; }

    /* ── Banner card ────────────────────────────────────────────────────── */
    .banner {
      background: var(--rose);
      border-radius: 18px; padding: 18px 20px;
      color: #fff; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .banner-text { font-size: 12px; opacity: 0.8; margin-bottom: 3px; }
    .banner-name { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .banner-ja {
      font-family: Georgia, serif;
      font-size: 36px; opacity: 0.25; line-height: 1;
    }

    /* ── Partner progress row ───────────────────────────────────────────── */
    .partner-row { margin-bottom: 14px; }
    .partner-meta {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 6px;
    }
    .partner-name { font-size: 14px; font-weight: 600; color: var(--ink); }
    .partner-count { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .partner-row:last-child { margin-bottom: 0; }

    /* ── Quiz ───────────────────────────────────────────────────────────── */
    .quiz-scorebar {
      background: var(--rose);
      border-radius: 16px; padding: 14px 20px; color: #fff;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .quiz-scorebar.plum { background: var(--plum); }
    .quiz-score-block { text-align: center; }
    .quiz-score-name { font-size: 11px; opacity: 0.7; margin-bottom: 2px; }
    .quiz-score-num { font-family: Georgia, serif; font-size: 32px; line-height: 1; }
    .quiz-mid { font-size: 12px; text-align: center; opacity: 0.8; line-height: 1.5; }
    .quiz-q-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 28px 20px;
      text-align: center; margin-bottom: 12px;
    }
    .quiz-eyebrow { font-size: 11px; color: var(--ink-3); letter-spacing: 0.5px; margin-bottom: 8px; }
    .quiz-kana {
      font-family: Georgia, 'Hiragino Mincho ProN', serif;
      font-size: 56px; color: var(--ink); margin-bottom: 6px; line-height: 1;
    }
    .quiz-romaji { font-size: 13px; color: var(--ink-3); letter-spacing: 0.5px; }
    .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .quiz-opt {
      padding: 16px 10px; border-radius: 14px;
      border: 1.5px solid var(--border); background: var(--surface);
      font-size: 14px; font-weight: 600; color: var(--ink);
      transition: all 0.18s; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .quiz-opt:active:not([disabled]) { transform: scale(0.96); }
    .quiz-opt.correct { background: var(--ok-lt); border-color: var(--ok); color: var(--ok); }
    .quiz-opt.wrong { background: var(--err-lt); border-color: var(--err); color: var(--err); }
    .quiz-opt:disabled { cursor: not-allowed; }
    .quiz-rule { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
    .quiz-rule-num { color: var(--rose); font-weight: 700; font-size: 14px; flex-shrink: 0; }
    .quiz-rule-text { font-size: 13px; color: var(--ink-2); line-height: 1.5; }

    /* ── Hiragana ───────────────────────────────────────────────────────── */
    .hira-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    }
    .hira-cell {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 4px;
      text-align: center; cursor: pointer; transition: all 0.18s;
    }
    .hira-cell:active { transform: scale(0.93); }
    .hira-cell.learned { background: var(--rose); border-color: transparent; }
    .hira-char {
      font-family: Georgia, 'Hiragino Mincho ProN', serif;
      font-size: 22px; color: var(--ink); display: block; line-height: 1;
    }
    .hira-cell.learned .hira-char { color: #fff; }
    .hira-rom {
      font-size: 9px; color: var(--ink-3); margin-top: 3px;
      display: block; letter-spacing: 0.3px;
    }
    .hira-cell.learned .hira-rom { color: rgba(255,255,255,0.65); }

    /* ── Tip card ───────────────────────────────────────────────────────── */
    .tip-card {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 16px;
    }
    .tip-label { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
    .tip-text { font-size: 13px; color: var(--ink-2); line-height: 1.65; }

    /* ── Toast ──────────────────────────────────────────────────────────── */
    .toast {
      position: fixed; top: calc(20px + env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%) translateY(-10px);
      background: var(--ink); color: var(--bg);
      padding: 11px 22px; border-radius: 30px;
      font-size: 14px; font-weight: 600;
      z-index: 999; opacity: 0;
      transition: opacity 0.22s, transform 0.22s;
      white-space: nowrap; letter-spacing: 0.2px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Nav card controls ──────────────────────────────────────────────── */
    .fc-controls {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .fc-count { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

    /* ── Result screen ──────────────────────────────────────────────────── */
    .result-vs { display: flex; align-items: center; justify-content: space-around; padding: 10px 0; }
    .result-score-block { text-align: center; }
    .result-score-name { font-size: 12px; color: var(--ink-3); margin-bottom: 4px; }
    .result-score-num {
      font-family: Georgia, serif; font-size: 52px; font-weight: normal;
      color: var(--rose); line-height: 1;
    }
    .result-score-num.plum { color: var(--plum); }
    .result-vs-sep { font-size: 18px; color: var(--border); font-weight: 700; }

    /* ── Animations ─────────────────────────────────────────────────────── */
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    .pulse { animation: pulse 2.5s ease-in-out infinite; display: inline-block; }

    @media (prefers-reduced-motion: reduce) {
      .fc { transition: none; }
      .pulse { animation: none; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

/* ── Data ──────────────────────────────────────────────────────────────── */

function getTodayWord() {
  return ALL_VOCAB[Math.floor(Date.now() / 86400000) % ALL_VOCAB.length];
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function loadState() { try { return JSON.parse(localStorage.getItem('jpCouple')||'null'); } catch { return null; } }
function saveState(s) { localStorage.setItem('jpCouple', JSON.stringify(s)); }

/* ── Vocab Tab ─────────────────────────────────────────────────────────── */
function VocabTab({ state, setState }) {
  const [activeCat, setActiveCat] = useState('일상');
  const [flipped, setFlipped] = useState(null);
  const [cardIdx, setCardIdx] = useState(0);
  const [mode, setMode] = useState('grid');

  const words = VOCAB_CATEGORIES[activeCat] || [];
  const word = words[cardIdx];

  const markLearned = (kana, partner) => {
    const key = partner === 1 ? 'p1Learned' : 'p2Learned';
    const current = state[key] || [];
    if (current.includes(kana)) return;
    const next = { ...state, [key]: [...current, kana] };
    if (!state.learned?.includes(kana)) next.learned = [...(state.learned||[]), kana];
    setState(next);
  };

  return (
    <div className="content">
      <div className="toggle-wrap">
        <button className={`toggle-btn${mode==='grid'?' active':''}`} onClick={() => setMode('grid')}>목록 보기</button>
        <button className={`toggle-btn${mode==='card'?' active':''}`}
          onClick={() => { setMode('card'); setCardIdx(0); setFlipped(false); }}>카드 학습</button>
      </div>

      <div className="tabs" style={{marginBottom:14}}>
        {Object.keys(VOCAB_CATEGORIES).map(cat => (
          <button key={cat} className={`tab${activeCat===cat?' active':''}`}
            onClick={() => { setActiveCat(cat); setCardIdx(0); setFlipped(false); }}>
            {CAT_ICONS[cat]} {cat}
          </button>
        ))}
      </div>

      {mode === 'grid' ? (
        <div className="vocab-grid">
          {words.map((w, i) => {
            const p1has = state.p1Learned?.includes(w.kana);
            const p2has = state.p2Learned?.includes(w.kana);
            return (
              <div key={i} className="vocab-card" onClick={() => setFlipped(flipped===i?null:i)}>
                <div className="vocab-kana">{w.kana}</div>
                {flipped === i ? (
                  <>
                    <div className="vocab-korean" style={{fontWeight:600}}>{w.korean}</div>
                    <div className="vocab-romaji">{w.romaji}</div>
                    <div className="vocab-checks" style={{marginTop:8}}>
                      <button className="btn btn-ghost-rose btn-sm"
                        onClick={e=>{e.stopPropagation();markLearned(w.kana,1);}}>
                        {p1has?'✓ ':''}{state.p1}
                      </button>
                      <button className="btn btn-ghost-plum btn-sm"
                        onClick={e=>{e.stopPropagation();markLearned(w.kana,2);}}>
                        {p2has?'✓ ':''}{state.p2}
                      </button>
                    </div>
                  </>
                ) : (
                  <div className="vocab-checks">
                    {p1has && <span className="v-check">{state.p1}</span>}
                    {p2has && <span className="v-check plum">{state.p2}</span>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ) : (
        <>
          <div className="fc-wrap" onClick={() => setFlipped(f=>!f)}>
            <div className={`fc${flipped?' flipped':''}`}>
              <div className="fc-face fc-front">
                <div className="fc-hint">탭하면 뒤집어요</div>
                <div className="fc-kana">{word?.kana}</div>
                <div className="fc-tag">{activeCat}</div>
              </div>
              <div className="fc-face fc-back">
                <div className="fc-romaji">{word?.romaji}</div>
                <div className="fc-meaning">{word?.korean}</div>
              </div>
            </div>
          </div>

          <div className="fc-controls">
            <button className="btn btn-ghost btn-sm"
              onClick={() => { setCardIdx((cardIdx-1+words.length)%words.length); setFlipped(false); }}>
              ← 이전
            </button>
            <span className="fc-count">{cardIdx+1} / {words.length}</span>
            <button className="btn btn-ghost btn-sm"
              onClick={() => { setCardIdx((cardIdx+1)%words.length); setFlipped(false); }}>
              다음 →
            </button>
          </div>

          {flipped && (
            <div className="card-flat">
              <div style={{fontSize:12,color:'var(--ink-3)',marginBottom:10,textAlign:'center',letterSpacing:'0.3px'}}>
                외웠나요?
              </div>
              <div style={{display:'flex',gap:8}}>
                <button className="btn btn-ghost-rose" style={{flex:1,padding:'12px'}}
                  onClick={() => markLearned(word.kana, 1)}>
                  {state.p1Learned?.includes(word?.kana)?'✓ 완료':state.p1+' 외웠어요'}
                </button>
                <button className="btn btn-ghost-plum" style={{flex:1,padding:'12px'}}
                  onClick={() => markLearned(word.kana, 2)}>
                  {state.p2Learned?.includes(word?.kana)?'✓ 완료':state.p2+' 외웠어요'}
                </button>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* ── Quiz Tab ──────────────────────────────────────────────────────────── */
function QuizTab({ state, setState, showToast }) {
  const [phase, setPhase] = useState('intro');
  const [player, setPlayer] = useState(1);
  const [scores, setScores] = useState({1:0, 2:0});
  const [round, setRound] = useState(0);
  const ROUNDS = 10;
  const [qs, setQs] = useState([]);
  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState(false);

  const startQuiz = () => {
    const pool = shuffle(ALL_VOCAB).slice(0, ROUNDS).map(word => ({
      word, options: shuffle([word, ...shuffle(ALL_VOCAB.filter(w=>w.kana!==word.kana)).slice(0,3)])
    }));
    setQs(pool); setRound(0); setScores({1:0,2:0}); setPlayer(1);
    setSelected(null); setAnswered(false); setPhase('playing');
  };

  const q = qs[round];

  const handleAnswer = (opt) => {
    if (answered) return;
    setSelected(opt); setAnswered(true);
    const correct = opt.kana === q.word.kana;
    if (correct) { setScores(s=>({...s,[player]:s[player]+1})); showToast('정답! 🎉'); }
    else showToast('아쉬워요 😅');
    setTimeout(() => {
      if (round+1 >= ROUNDS) { setPhase('result'); return; }
      setRound(r=>r+1); setPlayer(p=>p===1?2:1); setSelected(null); setAnswered(false);
    }, 1200);
  };

  if (phase === 'intro') return (
    <div className="content">
      <div className="section-title">커플 퀴즈 배틀</div>
      <div className="card" style={{textAlign:'center',padding:'32px 24px'}}>
        <div style={{fontSize:56,marginBottom:16}}>⚔️</div>
        <div style={{fontSize:20,fontWeight:700,marginBottom:8,color:'var(--ink)'}}>
          {state.p1} vs {state.p2}
        </div>
        <div style={{fontSize:14,color:'var(--ink-2)',marginBottom:28,lineHeight:1.7}}>
          번갈아가며 총 {ROUNDS}문제를 풀어요.<br/>누가 더 많이 맞힐까요?
        </div>
        <button className="btn btn-primary" onClick={startQuiz}>배틀 시작</button>
      </div>
      <div className="card" style={{marginTop:0}}>
        <div className="section-title" style={{marginBottom:12}}>게임 방법</div>
        {['일본어 단어를 보고 뜻을 고르세요','두 분이 번갈아가며 문제를 풀어요','정답이면 1점, 10문제 후 높은 점수 승리'].map((t,i)=>(
          <div key={i} className="quiz-rule">
            <span className="quiz-rule-num">{i+1}</span>
            <span className="quiz-rule-text">{t}</span>
          </div>
        ))}
      </div>
    </div>
  );

  if (phase === 'result') {
    const winner = scores[1]>scores[2]?state.p1:scores[2]>scores[1]?state.p2:null;
    return (
      <div className="content">
        <div className="section-title">결과 발표</div>
        <div className="card" style={{textAlign:'center',padding:'28px 24px'}}>
          <div style={{fontSize:52,marginBottom:12}}>{winner?'🏆':'🤝'}</div>
          <div style={{fontSize:22,fontWeight:700,marginBottom:6,color:'var(--ink)'}}>
            {winner ? `${winner} 승리!` : '무승부!'}
          </div>
          <div style={{fontSize:14,color:'var(--ink-3)',marginBottom:24}}>
            {winner ? '축하해요!' : '두 분 다 수고하셨어요!'}
          </div>
          <div className="result-vs" style={{marginBottom:28}}>
            <div className="result-score-block">
              <div className="result-score-name">{state.p1}</div>
              <div className="result-score-num">{scores[1]}</div>
            </div>
            <div className="result-vs-sep">VS</div>
            <div className="result-score-block">
              <div className="result-score-name">{state.p2}</div>
              <div className="result-score-num plum">{scores[2]}</div>
            </div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-ghost" style={{flex:1,padding:'13px'}}
              onClick={() => { setState({...state,quizWins:(state.quizWins||0)+(winner?1:0)}); setPhase('intro'); }}>
              홈으로
            </button>
            <button className="btn btn-primary" style={{flex:1,padding:'13px'}}
              onClick={() => { setState({...state,quizWins:(state.quizWins||0)+(winner?1:0)}); startQuiz(); }}>
              다시 도전
            </button>
          </div>
        </div>
      </div>
    );
  }

  const isP1 = player === 1;
  return (
    <div className="content">
      <div className={`quiz-scorebar${isP1?'':' plum'}`}>
        <div className="quiz-score-block">
          <div className="quiz-score-name">{state.p1}</div>
          <div className="quiz-score-num">{scores[1]}</div>
        </div>
        <div className="quiz-mid">
          <div>{round+1} / {ROUNDS}</div>
          <div style={{marginTop:2}}>{isP1?state.p1:state.p2}의 차례</div>
        </div>
        <div className="quiz-score-block">
          <div className="quiz-score-name">{state.p2}</div>
          <div className="quiz-score-num">{scores[2]}</div>
        </div>
      </div>

      <div className="quiz-q-card">
        <div className="quiz-eyebrow">이 단어의 뜻은?</div>
        <div className="quiz-kana">{q?.word.kana}</div>
        <div className="quiz-romaji">{q?.word.romaji}</div>
      </div>

      <div className="quiz-grid">
        {q?.options.map((opt, i) => {
          let cls = 'quiz-opt';
          if (answered) {
            if (opt.kana === q.word.kana) cls += ' correct';
            else if (selected?.kana === opt.kana) cls += ' wrong';
          }
          return (
            <button key={i} className={cls} disabled={answered} onClick={() => handleAnswer(opt)}>
              {opt.korean}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ── Hiragana Tab ──────────────────────────────────────────────────────── */
function KanaTab({ state, setState, showToast }) {
  const [kind, setKind] = useState('hiragana');
  const set = KANA_SETS[kind];
  const stateKey = set.key;

  const learned = new Set(state[stateKey]||[]);
  const total = set.data.filter(h=>h.char).length;
  const pct = Math.round(learned.size / total * 100);

  const toggle = (char) => {
    if (!char) return;
    const s = new Set(state[stateKey]||[]);
    if (s.has(char)) s.delete(char);
    else { s.add(char); showToast(`${char} ✓`); }
    setState({...state, [stateKey]:[...s]});
  };

  return (
    <div className="content">
      <div className="toggle-wrap">
        {Object.entries(KANA_SETS).map(([id, s]) => (
          <button key={id} className={`toggle-btn${kind===id?' active':''}`} onClick={() => setKind(id)}>
            <span style={{fontFamily:'Georgia,serif',marginRight:5}}>{s.glyph}</span>{s.label}
          </button>
        ))}
      </div>

      <div className="card" style={{marginBottom:12}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:8}}>
          <span style={{fontSize:14,fontWeight:600}}>{set.label} 진도</span>
          <span style={{fontFamily:'Georgia,serif',fontSize:22,color:'var(--rose)'}}>{pct}%</span>
        </div>
        <div className="prog-track">
          <div className="prog-fill" style={{width:`${pct}%`}}/>
        </div>
        <div style={{fontSize:12,color:'var(--ink-3)',marginTop:8,fontVariantNumeric:'tabular-nums'}}>
          {learned.size} / {total} 글자 완료
        </div>
      </div>

      <div className="card">
        <div className="tip-text" style={{marginBottom:14}}>
          글자를 탭하면 완료로 표시됩니다. 파트너와 번갈아 읽는 연습을 해보세요.
        </div>
        <div className="hira-grid">
          {set.data.map((h, i) => (
            h.char ? (
              <div key={i} className={`hira-cell${learned.has(h.char)?' learned':''}`} onClick={() => toggle(h.char)}>
                <span className="hira-char">{h.char}</span>
                <span className="hira-rom">{h.rom}</span>
              </div>
            ) : <div key={i} />
          ))}
        </div>
      </div>

      <div className="tip-card" style={{marginTop:12}}>
        <div className="tip-label">학습 팁</div>
        <div className="tip-text">
          {kind==='hiragana'
            ? '히라가나는 일본어의 기본 문자예요. 하루 한 행(5글자)씩 외워보세요.'
            : '가타카나는 외래어·이름 표기에 쓰여요. コーヒー(커피)처럼 익숙한 단어부터 시작해보세요.'}
        </div>
      </div>
    </div>
  );
}

/* ── Main App ──────────────────────────────────────────────────────────── */
function App() {
  const [appState, setAppState] = useState(null);
  const [tab, setTab] = useState('home');
  const [toast, setToast] = useState('');

  useEffect(() => {
    const s = loadState();
    if (s?.p1 && s?.p2) setAppState(s);
  }, []);

  const updateState = useCallback(next => { setAppState(next); saveState(next); }, []);

  const showToast = msg => {
    setToast(msg);
    setTimeout(() => setToast(''), 1800);
  };

  if (!appState?.p1) return (
    <SetupScreen onComplete={(p1, p2) => {
      updateState({ p1, p2, streak:1, learned:[], p1Learned:[], p2Learned:[], quizWins:0, hiragana:[], katakana:[] });
    }} />
  );

  const tabs = [
    { id:'home',  icon:'🏠', label:'홈' },
    { id:'vocab', icon:'📖', label:'어휘' },
    { id:'quiz',  icon:'⚔️',  label:'퀴즈' },
    { id:'kana',  icon:'あ',  label:'문자' },
  ];

  const HEADER_TITLES = {
    home:  { main:'우리 둘이', accent:'일본어' },
    vocab: { main:'어휘', accent:'학습' },
    quiz:  { main:'퀴즈', accent:'배틀' },
    kana:  { main:'가나', accent:'あ ア' },
  };
  const ht = HEADER_TITLES[tab];

  return (
    <div className="app">
      <Toast msg={toast} />

      <header className="header">
        <div>
          <div className="header-title">{ht.main} <span>{ht.accent}</span></div>
          <div className="header-sub">{appState.p1} · {appState.p2}</div>
        </div>
        <div className="header-mark" style={{color:'var(--rose)'}}>
          <svg width="18" height="18" viewBox="0 0 96 96" fill="none">
            <circle cx="36" cy="48" r="28" stroke="currentColor" strokeWidth="4" opacity="0.25"/>
            <circle cx="60" cy="48" r="28" stroke="currentColor" strokeWidth="4" opacity="0.25"/>
          </svg>
        </div>
      </header>

      {tab==='home'     && <HomeTab     state={appState} setState={updateState} />}
      {tab==='vocab'    && <VocabTab    state={appState} setState={updateState} />}
      {tab==='quiz'     && <QuizTab     state={appState} setState={updateState} showToast={showToast} />}
      {tab==='kana'     && <KanaTab     state={appState} setState={updateState} showToast={showToast} />}

      <nav className="nav">
        {tabs.map(t => (
          <button key={t.id} className={`nav-btn${tab===t.id?' active':''}`} onClick={() => setTab(t.id)}>
            <span className="nav-icon">{t.icon}</span>
            <span className="nav-label">{t.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
