<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="우리 둘이 일본어" />
  <meta name="theme-color" content="#bf3a57" />
  <meta name="description" content="부부가 함께 일본어를 배우는 커플 학습 앱" />
  <link rel="manifest" href="manifest.json" />
  <title>우리 둘이 일본어</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ── Tokens ─────────────────────────────────────────────────────────── */
    :root {
      --bg:        #f5f0eb;
      --surface:   #ffffff;
      --surface-2: #faf7f3;
      --rose:      #bf3a57;
      --rose-lt:   #fceaee;
      --rose-dk:   #8c1f36;
      --plum:      #3a2850;
      --plum-lt:   #ede8f5;
      --ink:       #1a1118;
      --ink-2:     #6b5a70;
      --ink-3:     #aaa0b0;
      --border:    #e6dce4;
      --shadow:    rgba(50,15,40,0.07);
      --ok:        #2e7d4f;
      --ok-lt:     #e8f5ed;
      --err:       #c0392b;
      --err-lt:    #fde8e6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #150f18;
        --surface:   #201720;
        --surface-2: #281e2c;
        --rose:      #e05a75;
        --rose-lt:   #3a1a26;
        --rose-dk:   #f07090;
        --plum:      #9570c0;
        --plum-lt:   #261e36;
        --ink:       #f0eaf5;
        --ink-2:     #b8a8c2;
        --ink-3:     #6e5e7a;
        --border:    #352538;
        --shadow:    rgba(0,0,0,0.3);
        --ok:        #4caf73;
        --ok-lt:     #1a3a27;
        --err:       #e05545;
        --err-lt:    #3a1a18;
      }
    }
    :root[data-theme="light"] {
      --bg:#f5f0eb; --surface:#ffffff; --surface-2:#faf7f3;
      --rose:#bf3a57; --rose-lt:#fceaee; --rose-dk:#8c1f36;
      --plum:#3a2850; --plum-lt:#ede8f5;
      --ink:#1a1118; --ink-2:#6b5a70; --ink-3:#aaa0b0;
      --border:#e6dce4; --shadow:rgba(50,15,40,0.07);
      --ok:#2e7d4f; --ok-lt:#e8f5ed; --err:#c0392b; --err-lt:#fde8e6;
    }
    :root[data-theme="dark"] {
      --bg:#150f18; --surface:#201720; --surface-2:#281e2c;
      --rose:#e05a75; --rose-lt:#3a1a26; --rose-dk:#f07090;
      --plum:#9570c0; --plum-lt:#261e36;
      --ink:#f0eaf5; --ink-2:#b8a8c2; --ink-3:#6e5e7a;
      --border:#352538; --shadow:rgba(0,0,0,0.3);
      --ok:#4caf73; --ok-lt:#1a3a27; --err:#e05545; --err-lt:#3a1a18;
    }

    /* ── Reset & Base ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overscroll-behavior: none;
      transition: background 0.2s, color 0.2s;
    }
    button, input { font-family: inherit; }
    button { cursor: pointer; border: none; background: none; }

    /* ── Layout shell ───────────────────────────────────────────────────── */
    .app {
      max-width: 480px; margin: 0 auto;
      min-height: 100vh; min-height: -webkit-fill-available;
      position: relative; display: flex; flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: calc(14px + env(safe-area-inset-top)) 20px 13px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .header-title {
      font-size: 17px; font-weight: 700; letter-spacing: -0.3px;
      color: var(--ink);
    }
    .header-title span { color: var(--rose); }
    .header-sub {
      font-size: 11px; color: var(--ink-3); margin-top: 1px;
      letter-spacing: 0.2px;
    }
    .header-mark {
      width: 34px; height: 34px;
      border: 1.5px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    /* ── Content ────────────────────────────────────────────────────────── */
    .content {
      flex: 1;
      padding: 20px 16px calc(84px + env(safe-area-inset-bottom));
      overflow-y: auto;
    }

    /* ── Cards ──────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px var(--shadow);
    }
    .card-flat {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    /* ── Buttons ────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; border-radius: 12px;
      font-size: 15px; font-weight: 600;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--rose);
      color: #fff;
      padding: 15px 24px; width: 100%;
      box-shadow: 0 4px 18px rgba(191,58,87,0.35);
      letter-spacing: 0.2px;
    }
    .btn-primary:hover { box-shadow: 0 6px 22px rgba(191,58,87,0.45); }
    .btn-primary:disabled { opacity: 0.4; pointer-events: none; }
    .btn-ghost {
      background: var(--surface-2);
      color: var(--ink-2);
      padding: 10px 18px;
      border: 1px solid var(--border);
    }
    .btn-ghost-rose {
      background: var(--rose-lt);
      color: var(--rose);
      padding: 10px 18px;
      border: 1px solid color-mix(in srgb, var(--rose) 20%, transparent);
    }
    .btn-ghost-plum {
      background: var(--plum-lt);
      color: var(--plum);
      padding: 10px 18px;
      border: 1px solid color-mix(in srgb, var(--plum) 20%, transparent);
    }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }

    /* ── Bottom nav ─────────────────────────────────────────────────────── */
    .nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 8px 8px max(10px, env(safe-area-inset-bottom));
      z-index: 100;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; min-width: 60px; padding: 6px 8px;
      border-radius: 14px; transition: background 0.18s;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-btn.active { background: var(--rose-lt); }
    .nav-icon { font-size: 20px; line-height: 1; }
    .nav-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
      color: var(--ink-3); transition: color 0.18s;
    }
    .nav-btn.active .nav-label { color: var(--rose); }

    /* ── Section headings ───────────────────────────────────────────────── */
    .section-title {
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.6px; text-transform: uppercase;
      color: var(--ink-3); margin-bottom: 10px;
    }

    /* ── Progress bar ───────────────────────────────────────────────────── */
    .prog-track { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .prog-fill {
      height: 100%; border-radius: 3px;
      background: var(--rose);
      transition: width 0.4s ease;
    }

    /* ── Pill tabs ──────────────────────────────────────────────────────── */
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      white-space: nowrap; padding: 7px 15px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
      background: var(--surface-2); color: var(--ink-3);
      border: 1px solid var(--border);
      transition: all 0.18s;
    }
    .tab.active { background: var(--rose); color: #fff; border-color: transparent; }

    /* ── Mode toggle ────────────────────────────────────────────────────── */
    .toggle-wrap {
      display: grid; grid-template-columns: 1fr 1fr;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 16px;
    }
    .toggle-btn {
      padding: 9px; border-radius: 9px; font-size: 14px; font-weight: 600;
      color: var(--ink-3); transition: all 0.18s;
    }
    .toggle-wrap.three { grid-template-columns: 1fr 1fr 1fr; }
    .toggle-wrap.three .toggle-btn { font-size: 12.5px; padding: 9px 4px; }
    .quiz-opt.kana {
      font-family: Georgia, 'Hiragino Mincho ProN', serif;
      font-size: 30px; padding: 14px 10px;
    }
    .toggle-btn.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 6px var(--shadow); }

    /* ── Setup screen ───────────────────────────────────────────────────── */
    .setup-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center;
      min-height: 100vh; min-height: -webkit-fill-available;
      padding: 48px 28px;
      background: var(--bg);
    }
    .setup-mark { margin-bottom: 24px; }
    .setup-kicker {
      font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase;
      color: var(--rose); font-weight: 700; margin-bottom: 8px;
    }
    .setup-title {
      font-family: Georgia, 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      font-size: 28px; font-weight: normal;
      color: var(--ink); line-height: 1.25;
      text-align: center; text-wrap: balance;
      margin-bottom: 6px;
    }
    .setup-ja {
      font-family: Georgia, 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      font-size: 14px; color: var(--ink-3); margin-bottom: 40px;
      letter-spacing: 2px;
    }
    .setup-form { width: 100%; max-width: 340px; }
    .field-group { margin-bottom: 16px; }
    .field-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; color: var(--ink-3); margin-bottom: 7px;
      display: block;
    }
    .field-input {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      color: var(--ink);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    .field-input::placeholder { color: var(--ink-3); }
    .field-input:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px var(--rose-lt);
    }

    /* ── Flashcard ──────────────────────────────────────────────────────── */
    .fc-wrap { perspective: 1200px; height: 230px; margin-bottom: 14px; }
    .fc {
      width: 100%; height: 100%; position: relative;
      transform-style: preserve-3d; transition: transform 0.48s cubic-bezier(.4,0,.2,1);
      cursor: pointer;
    }
    .fc.flipped { transform: rotateY(180deg); }
    .fc-face {
      position: absolute; width: 100%; height: 100%;
      border-radius: 20px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      backface-visibility: hidden;
    }
    .fc-front {
      background: var(--rose);
      color: #fff;
    }
    .fc-back {
      background: var(--plum);
      color: #fff;
      transform: rotateY(180deg);
    }
    .fc-hint { font-size: 11px; opacity: 0.6; margin-bottom: 10px; letter-spacing: 0.5px; }
    .fc-kana {
      font-family: Georgia, 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      font-size: 64px; line-height: 1; margin-bottom: 6px;
    }
    .fc-tag { font-size: 12px; opacity: 0.55; letter-spacing: 0.5px; }
    .fc-romaji { font-size: 32px; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; }
    .fc-meaning { font-size: 20px; opacity: 0.9; }

    /* ── Vocab grid ─────────────────────────────────────────────────────── */
    .vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .vocab-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 16px 10px;
      text-align: center; cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .vocab-card:active { transform: scale(0.97); }
    .vocab-kana {
      font-family: Georgia, 'Hiragino Mincho ProN', serif;
      font-size: 24px; margin-bottom: 5px; color: var(--ink);
    }
    .vocab-korean { font-size: 12px; color: var(--ink-2); font-weight: 500; }
    .vocab-romaji { font-size: 10px; color: var(--ink-3); margin-top: 2px; }
    .vocab-checks { display: flex; gap: 4px; justify-content: center; margin-top: 6px; }
    .v-check {
      font-size: 10px; padding: 2px 6px; border-radius: 6px;
      background: var(--rose-lt); color: var(--rose); font-weight: 600;
    }
    .v-check.plum { background: var(--plum-lt); color: var(--plum); }

    /* ── Today word ─────────────────────────────────────────────────────── */
    .today-card {
      background: var(--plum);
      border-radius: 18px; padding: 24px 20px;
      color: #fff; text-align: center;
      position: relative; overflow: hidden;
    }
    .today-card::before {
      content: '二'; position: absolute;
      font-family: Georgia, serif; font-size: 140px;
      color: rgba(255,255,255,0.04);
      right: -20px; top: -20px; line-height: 1;
      pointer-events: none;
    }
    .today-eyebrow {
      font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
      opacity: 0.55; margin-bottom: 12px; font-weight: 600;
    }
    .today-kana {
      font-family: Georgia, 'Hiragino Mincho ProN', serif;
      font-size: 56px; line-height: 1; margin-bottom: 10px;
    }
    .today-korean { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .today-romaji { font-size: 13px; opacity: 0.55; letter-spacing: 0.5px; }

    /* ── Stat row ───────────────────────────────────────────────────────── */
    .stat-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .stat-tile {
      flex: 1; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 10px; text-align: center;
    }
    .stat-num {
      font-family: Georgia, serif;
      font-size: 28px; font-weight: normal;
      color: var(--rose); line-height: 1; margin-bottom: 4px;
    }
    .stat-label { font-size: 10px; color: var(--ink-3); letter-spacing: 0.4px; font-weight: 600; text-transform: uppercase; }

    /* ── Banner card ────────────────────────────────────────────────────── */
    .banner {
      background: var(--rose);
      border-radius: 18px; padding: 18px 20px;
      color: #fff; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .banner-text { font-size: 12px; opacity: 0.8; margin-bottom: 3px; }
    .banner-name { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .banner-ja {
      font-family: Georgia, serif;
      font-size: 36px; opacity: 0.25; line-height: 1;
    }

    /* ── Partner progress row ───────────────────────────────────────────── */
    .partner-row { margin-bottom: 14px; }
    .partner-meta {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 6px;
    }
    .partner-name { font-size: 14px; font-weight: 600; color: var(--ink); }
    .partner-count { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .partner-row:last-child { margin-bottom: 0; }

    /* ── Quiz ───────────────────────────────────────────────────────────── */
    .quiz-scorebar {
      background: var(--rose);
      border-radius: 16px; padding: 14px 20px; color: #fff;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .quiz-scorebar.plum { background: var(--plum); }
    .quiz-score-block { text-align: center; }
    .quiz-score-name { font-size: 11px; opacity: 0.7; margin-bottom: 2px; }
    .quiz-score-num { font-family: Georgia, serif; font-size: 32px; line-height: 1; }
    .quiz-mid { font-size: 12px; text-align: center; opacity: 0.8; line-height: 1.5; }
    .quiz-q-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 28px 20px;
      text-align: center; margin-bottom: 12px;
    }
    .quiz-eyebrow { font-size: 11px; color: var(--ink-3); letter-spacing: 0.5px; margin-bottom: 8px; }
    .quiz-kana {
      font-family: Georgia, 'Hiragino Mincho ProN', serif;
      font-size: 56px; color: var(--ink); margin-bottom: 6px; line-height: 1;
    }
    .quiz-romaji { font-size: 13px; color: var(--ink-3); letter-spacing: 0.5px; }
    .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .quiz-opt {
      padding: 16px 10px; border-radius: 14px;
      border: 1.5px solid var(--border); background: var(--surface);
      font-size: 14px; font-weight: 600; color: var(--ink);
      transition: all 0.18s; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .quiz-opt:active:not([disabled]) { transform: scale(0.96); }
    .quiz-opt.correct { background: var(--ok-lt); border-color: var(--ok); color: var(--ok); }
    .quiz-opt.wrong { background: var(--err-lt); border-color: var(--err); color: var(--err); }
    .quiz-opt:disabled { cursor: not-allowed; }
    .quiz-rule { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
    .quiz-rule-num { color: var(--rose); font-weight: 700; font-size: 14px; flex-shrink: 0; }
    .quiz-rule-text { font-size: 13px; color: var(--ink-2); line-height: 1.5; }

    /* ── Hiragana ───────────────────────────────────────────────────────── */
    .hira-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    }
    .hira-cell {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 4px;
      text-align: center; cursor: pointer; transition: all 0.18s;
    }
    .hira-cell:active { transform: scale(0.93); }
    .hira-cell.learned { background: var(--rose); border-color: transparent; }
    .hira-char {
      font-family: Georgia, 'Hiragino Mincho ProN', serif;
      font-size: 22px; color: var(--ink); display: block; line-height: 1;
    }
    .hira-cell.learned .hira-char { color: #fff; }
    .hira-rom {
      font-size: 9px; color: var(--ink-3); margin-top: 3px;
      display: block; letter-spacing: 0.3px;
    }
    .hira-cell.learned .hira-rom { color: rgba(255,255,255,0.65); }

    /* ── Tip card ───────────────────────────────────────────────────────── */
    .tip-card {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 16px;
    }
    .tip-label { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
    .tip-text { font-size: 13px; color: var(--ink-2); line-height: 1.65; }

    /* ── Toast ──────────────────────────────────────────────────────────── */
    .toast {
      position: fixed; top: calc(20px + env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%) translateY(-10px);
      background: var(--ink); color: var(--bg);
      padding: 11px 22px; border-radius: 30px;
      font-size: 14px; font-weight: 600;
      z-index: 999; opacity: 0;
      transition: opacity 0.22s, transform 0.22s;
      white-space: nowrap; letter-spacing: 0.2px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Nav card controls ──────────────────────────────────────────────── */
    .fc-controls {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .fc-count { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

    /* ── Result screen ──────────────────────────────────────────────────── */
    .result-vs { display: flex; align-items: center; justify-content: space-around; padding: 10px 0; }
    .result-score-block { text-align: center; }
    .result-score-name { font-size: 12px; color: var(--ink-3); margin-bottom: 4px; }
    .result-score-num {
      font-family: Georgia, serif; font-size: 52px; font-weight: normal;
      color: var(--rose); line-height: 1;
    }
    .result-score-num.plum { color: var(--plum); }
    .result-vs-sep { font-size: 18px; color: var(--border); font-weight: 700; }

    /* ── Direction chips & rows ─────────────────────────────────────────── */
    .dir-chip {
      display: inline-block; font-size: 9.5px; font-weight: 700;
      letter-spacing: 0.2px; padding: 3px 7px; border-radius: 6px;
      margin-right: 6px; white-space: nowrap;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .dir-mean   { background: var(--rose-lt); color: var(--rose); }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ── My Notes: model ───────────────────────────────────────────────────── */
const NOTE_TYPES = {
  word:    { label:'단어', mark:'語', fields:['단어 (일본어)','읽기 (후리가나)','뜻 (한국어)','예문 · 메모'] },
  kanji:   { label:'한자', mark:'漢', fields:['한자','음독 / 훈독','뜻','단어 예시'] },
  convo:   { label:'회화', mark:'話', fields:['일본어 문장','읽기','한국어 뜻','상황 · 메모'] },
  grammar: { label:'문법', mark:'文', fields:['문형','접속 · 활용','의미','예문'] },
};
const TYPE_KEYS = Object.keys(NOTE_TYPES);
const MAX_BOX = 5;

let _nseq = 0;
function makeNote(type, front, reading, back, extra) {
  return {
    id: `${Date.now().toString(36)}${(_nseq++).toString(36)}${Math.random().toString(36).slice(2,6)}`,
    type, front:(front||'').trim(), reading:(reading||'').trim(),
    back:(back||'').trim(), extra:(extra||'').trim(),
    box:1, ok:0, ng:0,
    reps:0,   ivl:0, ease:2.5, lapses:0, due:0,
    r_reps:0, r_ivl:0, r_ease:2.5, r_lapses:0, r_due:0,
    p_reps:0, p_ivl:0, p_ease:2.5, p_lapses:0, p_due:0,
  };
}

/* Parse pasted lines. Fields split on / | tab , ; or 2+ spaces.
   2 fields → 앞/뜻, 3 → 앞/읽기/뜻, 4+ → 앞/읽기/뜻/메모 */
function parseNoteText(text, type) {
  const out = [];
  (text||'').split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line || line.startsWith('#') || line.startsWith('//')) return;
    const p = line.split(/\s*[\/|\t,;]\s*|\s{2,}/).map(s => s.trim()).filter(Boolean);
    if (p.length < 2) return;
    if (p.length === 2)      out.push(makeNote(type, p[0], '',   p[1], ''));
    else                     out.push(makeNote(type, p[0], p[1], p[2], p.slice(3).join(' · ')));
  });
  return out;
}

/* ── Answer matching (forgiving) ───────────────────────────────────────── */
function normAns(s) {
  return (s||'').toLowerCase()
    .replace(/[\s.,!?~・·\-—…"'’”“()[\]{}【】「」『』。、！？:;]/g, '');
}
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = Array.from({length:n+1}, (_,j) => j);
  let cur  = new Array(n+1);
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1] ? 0 : 1));
    }
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}
function answerMatches(input, answer) {
  const a = normAns(input);
  if (!a) return false;
  // accept any alternative separated by / , · or 또는
  const alts = String(answer||'').split(/[\/,·]|또는/).map(normAns).filter(Boolean);
  if (!alts.length) return false;
  return alts.some(b => {
    if (a === b) return true;
    const short = Math.min(a.length, b.length), long = Math.max(a.length, b.length);
    // one contains the other, and the shorter side still carries most of the answer
    if (b.length >= 2 && (b.includes(a) || a.includes(b))
        && short >= Math.max(2, Math.ceil(long * 0.5))) return true;
    // allow a single typo once the answer is long enough to afford one
    const tol = Math.max(long >= 4 ? 1 : 0, Math.floor(long * 0.25));
    return levenshtein(a, b) <= tol;
  });
}

/* ── SRS (Leitner) ─────────────────────────────────────────────────────── */
function gradeNote(note, correct) {
  return {
    ...note,
    box: correct ? Math.min(MAX_BOX, (note.box||1) + 1) : 1,
    ok:  (note.ok||0) + (correct ? 1 : 0),
    ng:  (note.ng||0) + (correct ? 0 : 1),
  };
}
/* ── Spaced repetition (SM-2 lite) ─────────────────────────────────────── */
const DAY = 86400000;
const AGAIN_DELAY = 600000;      /* 10 min */
const MAX_IVL = 365;
const DEFAULT_NEW_PER_DAY = 20;

/* A note is drilled in up to three directions, each with its own schedule.
   Knowing 勉強 means "공부" is not the same as being able to read it or to
   produce it from Korean, so they are tracked separately. Each direction
   keeps its scheduling fields under its own field prefix on the same note. */
const DIRS = {
  mean:   { pre:'',   label:'뜻',     ask:'알맞은 뜻은?',        short:'일→뜻' },
  read:   { pre:'r_', label:'읽기',   ask:'어떻게 읽을까요?',     short:'한자→읽기' },
  recall: { pre:'p_', label:'일본어', ask:'일본어로는?',          short:'뜻→일본어' },
};
const DIR_KEYS = ['mean', 'read', 'recall'];

function hasKanji(str) { return /[一-龯㐀-䶿]/.test(str || ''); }
/* grammar cards keep 접속·활용 in `reading`, not a reading — skip those */
function readable(n) { return n.type !== 'grammar' && !!n.reading && hasKanji(n.front); }
function dirApplies(n, dir) {
  if (dir === 'read') return readable(n);
  return true;
}

function sget(n, dir, f) { return n[DIRS[dir].pre + f]; }
function sset(n, dir, patch) {
  const pre = DIRS[dir].pre, out = { ...n };
  Object.keys(patch).forEach(k => { out[pre + k] = patch[k]; });
  return out;
}

/* what the card shows and what counts as the answer, per direction */
function qText(n, dir) { return dir === 'recall' ? n.back : n.front; }
function aText(n, dir) { return dir === 'read' ? n.reading : dir === 'recall' ? n.front : n.back; }

/* grade: 0 다시 · 1 어려움 · 2 보통 · 3 쉬움 */
function schedule(n, grade, dir) {
  const now = Date.now();
  let ivl = sget(n, dir, 'ivl') || 0;
  let ease = sget(n, dir, 'ease') || 2.5;
  const had = sget(n, dir, 'reps') || 0;
  const reps = had + 1;
  let lapses = sget(n, dir, 'lapses') || 0;

  if (grade === 0) {
    lapses += 1;
    ease = Math.max(1.3, ease - 0.2);
    return sset(n, dir, { ivl:0, ease, reps, lapses, due: now + AGAIN_DELAY, box:1 });
  }
  if (!had || ivl === 0) {
    ivl = grade === 3 ? 3 : 1;                 /* first graduation */
  } else if (grade === 1) {
    ease = Math.max(1.3, ease - 0.15);
    ivl = Math.max(1, Math.round(ivl * 1.2));
  } else if (grade === 2) {
    ivl = Math.max(1, Math.round(ivl * ease));
  } else {
    ease = Math.min(3.0, ease + 0.15);
    ivl = Math.max(1, Math.round(ivl * ease * 1.3));
  }
  ivl = Math.min(ivl, MAX_IVL);
  return sset(n, dir, { ivl, ease, reps, lapses, due: now + ivl * DAY, box: boxFromIvl(ivl) });
}
function previewIvl(n, grade, dir) { return sget(schedule(n, grade, dir), dir, 'ivl'); }

function boxFromIvl(ivl) {
  return ivl >= 60 ? 5 : ivl >= 21 ? 4 : ivl >= 7 ? 3 : ivl >= 1 ? 2 : 1;
}
function ivlLabel(ivl) {
  if (!ivl) return '10분';
  if (ivl < 30) return ivl + '일';
  if (ivl < 365) return Math.round(ivl / 30) + '개월';
  return '1년';
}

function todayStr(d) {
  d = d || new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function daysBetween(a, b) {
  return Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / DAY);
}

/* which directions the user has switched on (뜻 is always on) */
function activeDirs(state) {
  return DIR_KEYS.filter(d => d === 'mean' || (state.dirs || {})[d] !== false);
}
function entriesOf(notes, dirs) {
  const out = [];
  notes.forEach(n => dirs.forEach(d => { if (dirApplies(n, d)) out.push({ n, dir:d }); }));
  return out;
}

/* Cards waiting right now, split into review and new */
function dueSplit(notes, newLeft, dirs) {
  const now = Date.now();
  const all = entriesOf(notes, dirs);
  const review = all.filter(e => sget(e.n, e.dir, 'reps') && (sget(e.n, e.dir, 'due') || 0) <= now);
  const fresh  = all.filter(e => !sget(e.n, e.dir, 'reps'));
  return { review, fresh: fresh.slice(0, Math.max(0, newLeft)), freshTotal: fresh.length, total: all.length };
}

/* How many cards come back on each of the next 7 days */
function forecast(notes, days, dirs) {
  const all = entriesOf(notes, dirs);
  const out = [];
  const start = new Date(); start.setHours(0,0,0,0);
  for (let i = 1; i <= days; i++) {
    const from = start.getTime() + i * DAY;
    out.push(all.filter(e => {
      const due = sget(e.n, e.dir, 'due') || 0;
      return sget(e.n, e.dir, 'reps') && due >= from && due < from + DAY;
    }).length);
  }
  return out;
}

/* Which drill a card gets. Only 뜻 cards are ever typed — the other two
   would need a Japanese keyboard, so they stay multiple choice. */
function modeFor(n, dir) {
  const r = sget(n, dir, 'reps') || 0;
  if (r === 0) return 'flash';
  if (dir !== 'mean') return 'choice';
  return r < 4 ? 'choice' : 'type';
}

/* Weakest cards first, so review time goes where it is needed */
function studyOrder(notes) {
  return shuffle(notes).sort((x, y) => (x.box||1) - (y.box||1));
}

const HIRA_CHARS = new Set(HIRAGANA.filter(h => h.char).map(h => h.char));
function kanaKeyOf(char) { return HIRA_CHARS.has(char) ? 'hiragana' : 'katakana'; }

const KANA_MODES = [

/* ── Kana: flashcard ───────────────────────────────────────────────────── */
function KanaFlash({ rows, learned, onMark, onExit, label }) {
  /* unlearned first, so practice goes where it is needed */
  const [queue] = useState(() => {
    const a = shuffle(rows);
    return [...a.filter(r => !learned.has(r.char)), ...a.filter(r => learned.has(r.char))];
  });
  const [i, setI] = useState(0);
  const [flip, setFlip] = useState(false);
  const [right, setRight] = useState(0);
  const r = queue[i];
  if (!r) return null;

  const answer = (ok) => {
    onMark(r.char, ok);
    const n = right + (ok ? 1 : 0);
    if (i + 1 >= queue.length) { showKanaDone(onExit, n, queue.length); return; }
    setRight(n); setI(i + 1); setFlip(false);
  };

  return (
    <>
      <div className="rv-bar">
        <span className="fc-count">{label}</span>
        <span className="fc-count">{i + 1} / {queue.length}</span>
      </div>
      <div className="prog-track" style={{marginBottom:14}}>
        <div className="prog-fill" style={{width:`${(i / queue.length) * 100}%`}} />
      </div>

      <div className="fc-wrap" onClick={() => setFlip(f => !f)}>
        {/* key={i}: a new card mounts unflipped, so advancing never plays the
            flip-back animation that would reveal the next answer first */}
        <div className={`fc${flip ? ' flipped' : ''}`} key={i}>
          <div className="fc-face fc-front">
            <div className="fc-hint">탭하면 뒤집어요</div>
            <div className="fc-kana" style={{fontSize:96}}>{r.char}</div>
          </div>
          <div className="fc-face fc-back">
            <div className="fc-romaji" style={{fontSize:52}}>{r.rom}</div>
            <div className="fc-tag">{kanaKeyOf(r.char) === 'hiragana' ? '히라가나' : '가타카나'}</div>
          </div>
        </div>
      </div>

      {flip ? (
        <div style={{display:'flex', gap:8}}>
          <button className="btn btn-ghost" style={{flex:1, padding:14}} onClick={() => answer(false)}>아직이에요</button>
          <button className="btn btn-ghost-rose" style={{flex:1, padding:14}} onClick={() => answer(true)}>알아요 ✓</button>
        </div>
      ) : (
        <div className="tip-card" style={{textAlign:'center'}}>
          <div className="tip-text">소리를 먼저 떠올린 다음 뒤집어 확인해 보세요.</div>
        </div>
      )}
    </>
  );
}

/* ── Kana: quiz ────────────────────────────────────────────────────────── */
function KanaQuiz({ rows, onMark, onExit, label }) {
  const total = Math.min(10, rows.length);
  const [queue] = useState(() =>
    shuffle(rows).slice(0, total).map(r => ({ r, dir: Math.random() < 0.5 ? 'k2r' : 'r2k' })));
  const [i, setI] = useState(0);
  const [sel, setSel] = useState(null);
  const [right, setRight] = useState(0);
  const [combo, setCombo] = useState(0);
  const timer = useTimeoutRef();
  const q = queue[i];

  const opts = useMemo(() => {
    if (!q) return [];
    const others = shuffle(rows.filter(x => x.rom !== q.r.rom)).slice(0, 3);
    return shuffle([q.r, ...others]);
  }, [i]);

  if (!q) return null;

  const pick = (o) => {
    if (sel) return;
    const ok = o.rom === q.r.rom;
    setSel(o);
    onMark(q.r.char, ok);
    const n = right + (ok ? 1 : 0);
    setCombo(ok ? combo + 1 : 0);
    timer.current = setTimeout(() => {
      if (i + 1 >= queue.length) { showKanaDone(onExit, n, queue.length); return; }
      setRight(n); setI(i + 1); setSel(null);
    }, 800);
  };

  const k2r = q.dir === 'k2r';
  return (
    <>
      <div className="rv-bar">
        <span className="fc-count">{label}</span>
        <span className="fc-count">
          {combo >= 2 && <span className="combo">{combo}연속 🔥 </span>}
          {i + 1} / {queue.length}
        </span>
      </div>
      <div className="prog-track" style={{marginBottom:14}}>
        <div className="prog-fill" style={{width:`${(i / queue.length) * 100}%`}} />
      </div>

      <div className="quiz-q-card">
        <div className="quiz-eyebrow">{k2r ? '이 글자의 소리는?' : '이 소리의 글자는?'}</div>
        <div className="rv-q" style={{fontSize: k2r ? 76 : 48, letterSpacing: k2r ? 0 : 2}}>
          {k2r ? q.r.char : q.r.rom}
        </div>
      </div>

      <div className="quiz-grid">
        {opts.map((o, n) => {
          let cls = 'quiz-opt' + (k2r ? '' : ' kana');
          if (sel) {
            if (o.rom === q.r.rom) cls += ' correct';
            else if (sel.rom === o.rom) cls += ' wrong';
          }
          return (
            <button key={n} className={cls} disabled={!!sel} onClick={() => pick(o)}>
              {k2r ? o.rom : o.char}
            </button>
          );
        })}
      </div>
    </>
  );
}

function KanaTab({ state, setState, showToast }) {

  const [mode, setMode] = useState('chart');      // chart | flash | quiz
  const [result, setResult] = useState(null);

  const hira = HIRAGANA.filter(h => h.char);
  const kata = KATAKANA.filter(h => h.char);
  const rows = kind === 'hiragana' ? hira : kind === 'katakana' ? kata : [...hira, ...kata];
  const label = kind === 'hiragana' ? '히라가나' : kind === 'katakana' ? '가타카나' : '히라가나 + 가타카나';

  const learnedOf = (key) => new Set(state[key] || []);
  const allLearned = new Set([...(state.hiragana || []), ...(state.katakana || [])]);
  const done = rows.filter(r => allLearned.has(r.char)).length;
  const pct = rows.length ? Math.round(done / rows.length * 100) : 0;

  /* flip a single character in the chart */
  const toggle = (char) => {

  /* quiz / flashcard grading: right marks it known, wrong clears it */
  const mark = (char, ok) => {
    const key = kanaKeyOf(char);
    const s = new Set(state[key] || []);
    if (ok) s.add(char); else s.delete(char);
    setState({ ...state, [key]: [...s] });
  };

  const start = (m) => { setMode(m); setResult(null); setRunId(r => r + 1); };

  const chart = (rowsData, title) => (
    <div className="card" key={title}>
      <div className="tip-text" style={{marginBottom:14}}>
        {title} — 글자를 탭하면 완료로 표시됩니다.

      <div className="hira-grid">
        {rowsData.map((h, i) => (

          ) : <div key={i} />
        ))}
      </div>
    </div>
  );

  return (
    <div className="content">
      <div className="toggle-wrap three">
        <button className={`toggle-btn${kind === 'hiragana' ? ' active' : ''}`} onClick={() => setKind('hiragana')}>
          <span style={{fontFamily:'Georgia,serif', marginRight:4}}>あ</span>히라가나
        </button>
        <button className={`toggle-btn${kind === 'katakana' ? ' active' : ''}`} onClick={() => setKind('katakana')}>
          <span style={{fontFamily:'Georgia,serif', marginRight:4}}>ア</span>가타카나
        </button>
        <button className={`toggle-btn${kind === 'mixed' ? ' active' : ''}`} onClick={() => setKind('mixed')}>
          🔀 섞기
        </button>
      </div>

      <div className="toggle-wrap three">
        {KANA_MODES.map(m => (
          <button key={m.id} className={`toggle-btn${mode === m.id ? ' active' : ''}`}
            onClick={() => start(m.id)}>{m.label}</button>
        ))}
      </div>

      {result ? (
        <div className="card" style={{textAlign:'center', padding:30}}>
          <div className="empty-ja" style={{color:'var(--rose)'}}>
            {result.right === result.total ? '満' : '復'}
          </div>
          <div style={{fontFamily:'Georgia,serif', fontSize:52, color:'var(--rose)', lineHeight:1}}>
            {Math.round(result.right / result.total * 100)}%
          </div>
          <div style={{fontSize:14, color:'var(--ink-2)', marginTop:8}}>
            {result.total}개 중 {result.right}개 정답
          </div>
          <div style={{display:'flex', gap:8, marginTop:24}}>
            <button className="btn btn-ghost" style={{flex:1, padding:14}}
              onClick={() => { setResult(null); setMode('chart'); }}>표로</button>
            <button className="btn btn-ghost-rose" style={{flex:1, padding:14}}
              onClick={() => { setResult(null); setRunId(r => r + 1); }}>한 번 더</button>
          </div>
        </div>
      ) : mode === 'flash' ? (
        <KanaFlash key={runId} rows={rows} learned={allLearned} label={label}
          onMark={mark} onExit={setResult} />
      ) : mode === 'quiz' ? (
        <KanaQuiz key={runId} rows={rows} label={label}
          onMark={mark} onExit={setResult} />
      ) : (
        <>
          <div className="card" style={{marginBottom:12}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:8}}>
              <span style={{fontSize:14, fontWeight:600}}>{label} 진도</span>
              <span style={{fontFamily:'Georgia,serif', fontSize:22, color:'var(--rose)'}}>{pct}%</span>
            </div>
            <div className="prog-track"><div className="prog-fill" style={{width:`${pct}%`}} /></div>
            <div style={{fontSize:12, color:'var(--ink-3)', marginTop:8, fontVariantNumeric:'tabular-nums'}}>
              {done} / {rows.length} 글자 완료
            </div>
          </div>

          {kind === 'mixed'
            ? [chart(HIRAGANA, '히라가나'), chart(KATAKANA, '가타카나')]
            : chart(kind === 'hiragana' ? HIRAGANA : KATAKANA, label)}

          <div className="tip-card" style={{marginTop:12}}>
            <div className="tip-label">학습 팁</div>
            <div className="tip-text">
              {kind === 'hiragana'
                ? '히라가나는 일본어의 기본 문자예요. 하루 한 행(5글자)씩 외워보세요.'
                : kind === 'katakana'
                ? '가타카나는 외래어·이름 표기에 쓰여요. コーヒー(커피)처럼 익숙한 단어부터 시작해보세요.'
                : 'シ와ツ, ソ와ン처럼 헷갈리는 글자는 섞어서 퀴즈를 풀어야 확실히 구분돼요.'}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* 가사·시에서 온 문학적 표현과 저빈도 한자 — 실용 필터에서 빠짐 */
const LIT_CARDS = new Set([
  'word|逢う','word|山越え','word|彼方','word|遥か','word|惹かれる',
  'word|オッチョンジ','word|やるせない','word|胸の内','word|むさぼり食べる',
  'kanji|逢','kanji|遥','kanji|惹',
  'convo|時には思い出すでしょう。','convo|冷たい人だけど','convo|あんなに愛した思い出を',
  'convo|忘れはしないでしょう。','convo|青い月を見上げ','convo|一人過ごす夜は',
  'convo|誓った言葉を繰り返し','convo|逢いたくなるでしょう。','convo|山越え遠くに',
  'convo|別れても','convo|海の彼方遥か','convo|離れても',
  'convo|黄色いシャツ着た無口な男','convo|オッチョンジ惹かれる','convo|オッチョンジ好きなの',
  'convo|男らしくて笑顔がやさしい','convo|夢にまで見るわたし変なの',
  'convo|ああやるせないこの胸のうち','convo|あああの人は知ってか知らずか','convo|彼に惹かれる。',
  'convo|あかい葉っぱがひらひらと','convo|秋の風にゆれている',
  'convo|ゆっくり歩けば見えてくる','convo|小さな秋のしあわせが',
  'grammar|～はしない','grammar|동사 연용형 (중지법)','grammar|～てか～ずか','grammar|～とあれば',
]);
function cardLevel(type, front) { return LIT_CARDS.has(type + '|' + front) ? 'lit' : 'core'; }

function deckNotes(d) {
  const out = [];
  TYPE_KEYS.forEach(t => (d[t] || []).forEach(r => {
    const n = makeNote(t, r[0], r[1], r[2], r[3] || '');
    n.deck = d.id;
    n.lv = cardLevel(t, r[0]);
    out.push(n);
  }));
  return out;
}

/* exact card -> deck id, so notes saved before decks existed get tagged */
function deckKey(type, front, extra) { return type + '|' + front + '|' + (extra || ''); }
const DECK_INDEX = (() => {
  const m = {};
  STUDY_DECKS.forEach(d => TYPE_KEYS.forEach(t =>
    (d[t] || []).forEach(r => { m[deckKey(t, r[0], r[3] || '')] = d.id; })));
  return m;
})();
function backfillDecks(notes) {
  if (!notes || !notes.some(n => n.deck === undefined || n.lv === undefined || n.reps === undefined || n.r_reps === undefined)) return notes;
  return notes.map(n => {
    const next = { ...n };
    if (next.deck === undefined) next.deck = DECK_INDEX[deckKey(n.type, n.front, n.extra)] || '';
    if (next.lv === undefined) next.lv = cardLevel(n.type, n.front);
    if (next.reps === undefined) {
      /* carry old Leitner progress over: a known card keeps its standing
         but comes due now, then follows the real schedule from there */
      const box = next.box || 1;
      next.reps   = box > 1 ? box - 1 : 0;
      next.ivl    = [0, 0, 1, 7, 21, 60][box] || 0;
      next.ease   = 2.5;
      next.lapses = 0;
      next.due    = next.reps ? Date.now() : 0;
    }
    if (next.r_reps === undefined) {
      next.r_reps = 0; next.r_ivl = 0; next.r_ease = 2.5; next.r_lapses = 0; next.r_due = 0;
      next.p_reps = 0; next.p_ivl = 0; next.p_ease = 2.5; next.p_lapses = 0; next.p_due = 0;
    }
    return next;
  });
}
function deckCount(d) {
  return TYPE_KEYS.reduce((n, t) => n + ((d[t] || []).length), 0);
}

/* ── Lessons: 수업(날짜)별 ─────────────────────────────────────────────── */
function fmtLessonDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const dow = ['일','월','화','수','목','금','토'][new Date(y, m - 1, d).getDay()];
  return `${m}월 ${d}일 (${dow})`;
}

function LessonsView({ notes, loaded, onLoad, onPick, onBack }) {
  const groups = [];
  STUDY_DECKS.forEach(d => {
    const g = groups.find(x => x.date === d.date);
    if (g) g.decks.push(d); else groups.push({ date:d.date, decks:[d] });
  });
  groups.sort((a, b) => {
    if (!a.date) return -1;
    if (!b.date) return 1;
    return b.date.localeCompare(a.date);
  });

  const stats = (id) => {
    const ns = notes.filter(n => n.deck === id);
    return { total: ns.length, done: ns.filter(n => (n.box || 1) >= MAX_BOX).length };
  };
  const rest = STUDY_DECKS.filter(d => !loaded.includes(d.id));

          {g.decks.map(d => {
            const has = loaded.includes(d.id);
            const st = stats(d.id);
            const pct = st.total ? Math.round(st.done / st.total * 100) : 0;
            return (
              <div className="card" key={d.id} style={{padding:16, marginBottom:8}}>
                <div style={{display:'flex', gap:10, alignItems:'flex-start', marginBottom:10}}>

                  {TYPE_KEYS.filter(t => (d[t] || []).length).map(t => (
                    <span className="stat-pill" key={t}>
                      <span style={{fontFamily:'Georgia,serif'}}>{NOTE_TYPES[t].mark}</span>

/* ── Mode: 짝 맞추기 ───────────────────────────────────────────────────── */
function ReviewMatch({ pool, grade, onFinish, onBack }) {
  const [pairs] = useState(() => studyOrder(pool).slice(0, Math.min(5, pool.length)));
  const [ja] = useState(() => shuffle(pairs));
  const [ko] = useState(() => shuffle(pairs));
  const [selJa, setSelJa] = useState(null);
  const [selKo, setSelKo] = useState(null);
  const [done, setDone] = useState([]);
  const [bad, setBad] = useState(false);
  const [tries, setTries] = useState(0);
  const [secs, setSecs] = useState(0);
  const timer = useTimeoutRef();

  useEffect(() => {
    const t = setInterval(() => setSecs(s => s + 1), 1000);
    return () => clearInterval(t);
  }, []);

  const resolve = (jId, kId) => {
    setTries(t => t + 1);
    if (jId === kId) {
      grade(jId, true);
      const nd = [...done, jId];
      setDone(nd);
      setSelJa(null); setSelKo(null);
      if (nd.length >= pairs.length) {
        timer.current = setTimeout(() => onFinish({ right:pairs.length, total:pairs.length, secs, tries:tries + 1 }), 500);
      }
    } else {
      grade(jId, false);
      setBad(true);
      timer.current = setTimeout(() => { setBad(false); setSelJa(null); setSelKo(null); }, 550);
    }
  };

  const tapJa = (id) => {
    if (bad || done.includes(id)) return;
    if (selKo) resolve(id, selKo); else setSelJa(selJa === id ? null : id);
  };
  const tapKo = (id) => {
    if (bad || done.includes(id)) return;
    if (selJa) resolve(selJa, id); else setSelKo(selKo === id ? null : id);
  };

  const cls = (id, sel) =>
    'match-tile' + (done.includes(id) ? ' done' : '') +
    (bad && sel === id ? ' bad shake' : (sel === id ? ' sel' : ''));

  return (
    <div className="content">
      <BackBar onBack={onBack} right={
        <span className="fc-count">{done.length} / {pairs.length} · {secs}초</span>
      } />
      <div className="tip-card" style={{marginBottom:12}}>
        <div className="tip-text">왼쪽 일본어와 오른쪽 뜻을 하나씩 눌러 짝을 맞춰 보세요.</div>
      </div>

      <div style={{display:'flex', gap:7}}>
        <div style={{flex:1, display:'flex', flexDirection:'column', gap:7}}>
          {ja.map(n => (
            <button key={n.id} className={cls(n.id, selJa) + ' ja'} onClick={() => tapJa(n.id)}>
              {n.front}
            </button>
          ))}
        </div>
        <div style={{flex:1, display:'flex', flexDirection:'column', gap:7}}>
          {ko.map(n => (
            <button key={n.id} className={cls(n.id, selKo)} onClick={() => tapKo(n.id)}>
              {n.back}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

    setScores(next);
    timer.current = setTimeout(() => {
      if (i + 1 >= queue.length) setPhase('result');
      else { setI(i + 1); setPlayer(p => p === 1 ? 2 : 1); setSel(null); }
    }, 850);
  };

  const isP1 = player === 1;
  return (
    <div className="content">
      <BackBar onBack={onBack} right={<span className="fc-count">{i+1} / {queue.length}</span>} />

      <div className={`quiz-scorebar${isP1 ? '' : ' plum'}`}>
        <div className="quiz-score-block">
          <div className="quiz-score-name">{state.p1}</div>
          <div className="quiz-score-num">{scores[1]}</div>
        </div>
        <div className="quiz-mid">
          {NOTE_TYPES[n.type].label}<br/>
          <strong>{isP1 ? state.p1 : state.p2}</strong>의 차례
        </div>
        <div className="quiz-score-block">
          <div className="quiz-score-name">{state.p2}</div>
          <div className="quiz-score-num">{scores[2]}</div>
        </div>
      </div>

      <div className="quiz-q-card">
        <div className={`rv-q${n.front.length > 10 ? ' sm' : ''}`}>{n.front}</div>
        {n.reading && <div className="rv-sub">{n.reading}</div>}
      </div>

      <div className="quiz-grid">
        {opts.map(o => {
          let cls = 'quiz-opt';
          if (sel) {
            if (o.id === n.id) cls += ' correct';
            else if (sel.id === o.id) cls += ' wrong';
          }
          return (
            <button key={o.id} className={cls} disabled={!!sel} onClick={() => pick(o)}>
              {o.back}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ── Result screen ─────────────────────────────────────────────────────── */
function ReviewResult({ result, onRetry, onHome }) {
  const pct = result.total ? Math.round(result.right / result.total * 100) : 0;
  const msg = pct === 100 ? '완벽해요! 다음 단계로 넘어가도 좋아요'
            : pct >= 80  ? '좋아요! 거의 다 외웠어요'
            : pct >= 50  ? '절반은 넘었어요. 한 번 더 돌려볼까요?'
            :              '아직 낯선 카드가 많아요. 플래시카드로 먼저 익혀보세요';
  return (
    <div className="content">
      <div className="card" style={{textAlign:'center', padding:30}}>
        <div className="empty-ja" style={{color:'var(--rose)'}}>{pct === 100 ? '満' : '復'}</div>
        <div style={{fontFamily:'Georgia,serif', fontSize:52, color:'var(--rose)', lineHeight:1}}>{pct}%</div>
        <div style={{fontSize:14, color:'var(--ink-2)', marginTop:8, fontVariantNumeric:'tabular-nums'}}>
          {result.total}문제 중 {result.right}개 정답
          {result.secs !== undefined && ` · ${result.secs}초`}
        </div>
        <div style={{fontSize:13, color:'var(--ink-3)', margin:'16px 0 24px', lineHeight:1.6}}>{msg}</div>
        <div style={{display:'flex', gap:8}}>
          <button className="btn btn-ghost" style={{flex:1, padding:14}} onClick={onHome}>노트로</button>
          <button className="btn btn-ghost-rose" style={{flex:1, padding:14}} onClick={onRetry}>한 번 더</button>
        </div>
      </div>
    </div>
  );
}

/* ── Add screen ────────────────────────────────────────────────────────── */
function NotesAdd({ onAdd, onBack, showToast }) {
  const [type, setType] = useState('word');
  const [way, setWay] = useState('paste');
  const [text, setText] = useState('');
  const [f, setF] = useState(['','','','']);
  const fileRef = useRef(null);

  const preview = way === 'paste' ? parseNoteText(text, type) : [];

  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => setText(t => (t ? t + '\n' : '') + String(r.result || ''));
    r.onerror = () => showToast('파일을 읽지 못했어요');
    r.readAsText(file, 'utf-8');
    e.target.value = '';
  };

  const addManual = () => {
    if (!f[0].trim() || !f[2].trim()) { showToast('일본어와 뜻은 필수예요'); return; }
    onAdd([makeNote(type, f[0], f[1], f[2], f[3])]);
    setF(['','','','']);
  };

  const T = NOTE_TYPES[type];

  return (
    <div className="content">
      <BackBar onBack={onBack} right={null} />

      <div className="section-title">어떤 내용인가요</div>
      <div className="tabs" style={{marginBottom:14}}>
        {TYPE_KEYS.map(k => (
          <button key={k} className={`tab${type === k ? ' active' : ''}`} onClick={() => setType(k)}>
            <span style={{fontFamily:'Georgia,serif', marginRight:4}}>{NOTE_TYPES[k].mark}</span>
            {NOTE_TYPES[k].label}
          </button>
        ))}
      </div>

      <div className="toggle-wrap">
        <button className={`toggle-btn${way === 'paste' ? ' active' : ''}`} onClick={() => setWay('paste')}>붙여넣기</button>
        <button className={`toggle-btn${way === 'one' ? ' active' : ''}`} onClick={() => setWay('one')}>하나씩 입력</button>
      </div>

      {way === 'paste' ? (
        <>
          <button className="file-btn" onClick={() => fileRef.current && fileRef.current.click()}>
            📄 파일 불러오기 (.txt · .csv)
          </button>
          <input ref={fileRef} type="file" accept=".txt,.csv,.tsv,text/plain" style={{display:'none'}} onChange={onFile} />

          <textarea className="ta" value={text} onChange={e => setText(e.target.value)}
            placeholder={`勉強 / べんきょう / 공부\n約束 / やくそく / 약속\n大切 / たいせつ / 소중함`} />

          <div className="tip-card" style={{margin:'10px 0'}}>
            <div className="tip-label">입력 형식</div>
            <div className="tip-text">
              한 줄에 하나씩, <strong>/</strong> 또는 쉼표·탭으로 구분해요.<br/>
              2칸이면 <em>{T.fields[0]} / {T.fields[2]}</em>,<br/>
              3칸이면 <em>{T.fields[0]} / {T.fields[1]} / {T.fields[2]}</em>,<br/>
              4칸이면 뒤에 <em>{T.fields[3]}</em>까지 들어가요.
            </div>
          </div>

          <button className="btn btn-primary" disabled={!preview.length} onClick={() => { onAdd(preview); setText(''); }}>
            {preview.length ? `${preview.length}개 노트에 추가` : '내용을 입력해 주세요'}
          </button>
        </>
      ) : (
        <>
          {T.fields.map((lab, k) => (
            <div className="field-group" key={k}>
              <label className="field-label">{lab}{(k === 0 || k === 2) ? ' *' : ''}</label>
              <input className="field-input" value={f[k]}
                onChange={e => setF(v => v.map((x, j) => j === k ? e.target.value : x))} />
            </div>
          ))}
          <button className="btn btn-primary" onClick={addManual}>노트에 추가</button>
        </>
      )}
    </div>
  );
}

/* ── Notes tab (router) ────────────────────────────────────────────────── */
function NotesTab({ state, setState, showToast }) {
  const [view, setView] = useState('home');
  const [mode, setMode] = useState(null);
  const [scope, setScope] = useState('all');
  const [deckScope, setDeckScope] = useState('all');
  const coreOnly = state.coreOnly !== false;
  const setCoreOnly = (v) => setState({ ...state, coreOnly: typeof v === 'function' ? v(coreOnly) : v });
  const [result, setResult] = useState(null);
  const [runId, setRunId] = useState(0);

  const notes = state.notes || [];
  /* derived from the notes themselves, so it can never desync or double-load */
  const loadedDecks = useMemo(() => {
    const seen = new Set(notes.map(n => n.deck).filter(Boolean));
    return STUDY_DECKS.filter(d => seen.has(d.id)).map(d => d.id);
  }, [notes]);
  const inScope = notes.filter(n =>
    (scope === 'all' || n.type === scope) &&
    (deckScope === 'all' || n.deck === deckScope));
  const litCount = inScope.filter(n => n.lv === 'lit').length;
  const pool = coreOnly ? inScope.filter(n => n.lv !== 'lit') : inScope;
  const lesson = deckScope === 'all' ? null : STUDY_DECKS.find(d => d.id === deckScope);
  const scopeLabel = [lesson && lesson.name, scope === 'all' ? '전체' : NOTE_TYPES[scope].label]
    .filter(Boolean).join(' · ');

  const addNotes = (list) => {
    if (!list || !list.length) { showToast('추가할 내용이 없어요'); return; }
    setState({ ...state, notes: [...notes, ...list] });
    showToast(`${list.length}개 추가 ✓`);
  };
  const delNote = (id) => setState({ ...state, notes: notes.filter(n => n.id !== id) });
  const loadDeck = (d) => {
    const list = Array.isArray(d) ? d : [d];
    const fresh = list.filter(x => !loadedDecks.includes(x.id));
    if (!fresh.length) return;
    const added = fresh.flatMap(deckNotes);
    setState({ ...state, notes: [...notes, ...added] });
    showToast(`${added.length}장 불러왔어요 ✓`);
  };
  const grade = (id, correct) =>
    setState({ ...state, notes: notes.map(n => n.id === id ? gradeNote(n, correct) : n) });

  const start = (m) => { setMode(m); setResult(null); setRunId(r => r + 1); setView('review'); };
  const home = () => { setView('home'); setMode(null); setResult(null); };
  const finish = (r) => { setResult(r); setView('result'); };

  if (view === 'decks')  return <LessonsView notes={notes} loaded={loadedDecks} onLoad={loadDeck}
                                   onPick={(id) => { setDeckScope(id); setScope('all'); home(); }}
                                   onBack={home} />;
  if (view === 'add')    return <NotesAdd onAdd={addNotes} onBack={home} showToast={showToast} />;
  if (view === 'manage') return <NotesManage notes={notes} onDel={delNote} onBack={home} />;
  if (view === 'result') return <ReviewResult result={result} onHome={home} onRetry={() => start(mode)} />;

  if (view === 'review') {
    const p = { key:runId, pool, grade, onFinish:finish, onBack:home };
    if (mode === 'flash')  return <ReviewFlash  {...p} />;
    if (mode === 'choice') return <ReviewChoice {...p} />;
    if (mode === 'type')   return <ReviewType   {...p} />;
    if (mode === 'match')  return <ReviewMatch  {...p} />;
    if (mode === 'couple') return <ReviewCouple key={runId} pool={pool} state={state} grade={grade} onBack={home} />;
  }

  /* ── home ── */
  if (!notes.length) {
    return (
      <div className="content">
        <div className="card">
          <div className="empty-wrap">
            <div className="empty-ja">筆</div>
            <div className="empty-text">
              배운 단어 · 한자 · 회화 · 문법을 올려두면<br/>
              5가지 방법으로 재미있게 복습할 수 있어요.
            </div>
            <button className="btn btn-primary" onClick={() => setView('decks')}>수업별 노트 불러오기</button>
            <button className="btn btn-ghost" style={{width:'100%', marginTop:8, padding:12}}
              onClick={() => setView('add')}>
              직접 내용 추가하기
            </button>
          </div>
        </div>
      </div>
    );
  }

  const shown = coreOnly ? notes.filter(n => n.lv !== 'lit') : notes;
  const weak = shown.filter(n => (n.box||1) < 3).length;
  const mastered = shown.filter(n => (n.box||1) >= MAX_BOX).length;

  return (
    <div className="content">
      <div className="pill-row">
        <span className="stat-pill">📚 전체 {shown.length}장</span>
        <span className="stat-pill">🔥 복습 필요 {weak}장</span>
        <span className="stat-pill">⭐ 완성 {mastered}장</span>
      </div>

      {lesson && (
        <button className="scope-all on" style={{marginBottom:12}} onClick={() => setDeckScope('all')}>
          📅 {lesson.date ? fmtLessonDate(lesson.date) + ' · ' : ''}{lesson.name} — 탭하면 전체로
        </button>
      )}

      <div className="section-title">무엇을 복습할까요</div>
      <div className="nt-grid">
        {TYPE_KEYS.map(k => {
          const c = notes.filter(n => n.type === k
            && (deckScope === 'all' || n.deck === deckScope)
            && (!coreOnly || n.lv !== 'lit')).length;
          return (
            <button key={k} className={`nt-card${scope === k ? ' on' : ''}`}
              onClick={() => setScope(scope === k ? 'all' : k)}>
              <span className="nt-mark">{NOTE_TYPES[k].mark}</span>
              <div className="nt-name">{NOTE_TYPES[k].label}</div>
              <div className="nt-count">{c}장</div>
            </button>
          );
        })}
      </div>
      <button className={`scope-all${scope === 'all' ? ' on' : ''}`}
        onClick={() => setScope('all')}>
        {scope === 'all' ? '✓ ' : ''}{lesson ? '이 수업' : '전체'} 모든 유형 함께 복습
      </button>

      {litCount > 0 && (
        <button className={`scope-all${coreOnly ? ' on' : ''}`} style={{marginBottom:16}}
          onClick={() => setCoreOnly(c => !c)}>
          {coreOnly
            ? `⭐ 실용 우선 · 가사·문학 표현 ${litCount}장 제외됨`
            : `📖 가사·문학 표현 ${litCount}장 포함 중`}
        </button>
      )}

      <div className="section-title">복습 방법 · {scopeLabel} {pool.length}장</div>
      {REVIEW_MODES.map(m => (
        <button key={m.id} className="mode-row" disabled={pool.length < m.min} onClick={() => start(m.id)}>
          <span className="mode-emoji">{m.emoji}</span>
          <span style={{minWidth:0}}>
            <span className="mode-name" style={{display:'block'}}>{m.name}</span>
            <span className="mode-desc" style={{display:'block'}}>
              {pool.length < m.min ? `${m.min}장 이상 필요해요` : m.desc}
            </span>
          </span>
          <span className="mode-arrow">›</span>
        </button>
      ))}

      <div style={{display:'flex', gap:8, marginTop:14}}>
        <button className="btn btn-ghost-rose" style={{flex:1, padding:13}} onClick={() => setView('add')}>+ 내용 추가</button>
        <button className="btn btn-ghost" style={{flex:1, padding:13}} onClick={() => setView('manage')}>목록 관리</button>
      </div>
      <button className="btn btn-ghost" style={{width:'100%', padding:13, marginTop:8}}
        onClick={() => setView('decks')}>
        📅 수업별 복습 {loadedDecks.length < STUDY_DECKS.length
          ? `· ${STUDY_DECKS.length - loadedDecks.length}개 수업 안 불러옴` : `· ${STUDY_DECKS.length}개 수업`}
      </button>
    </div>
  );
}

/* ── Study session: one queue, drill picked per card ───────────────────── */
const GRADES = [
  { g:0, label:'다시',   cls:'g-again' },
  { g:1, label:'어려움', cls:'g-hard'  },
  { g:2, label:'보통',   cls:'g-good'  },
  { g:3, label:'쉬움',   cls:'g-easy'  },
];

function StudySession({ queue: initial, pool, furigana, onGrade, onDone, onExit }) {
  const [queue, setQueue] = useState(initial);
  const [i, setI] = useState(0);
  const [revealed, setRevealed] = useState(false);  /* back is showing now */
  const [seen, setSeen] = useState(false);          /* answer shown at least once */
  const [sel, setSel] = useState(null);
  const [val, setVal] = useState('');
  const [judged, setJudged] = useState(null);
  const [stats, setStats] = useState({ done:0, again:0 });
  const timer = useTimeoutRef();

  const e = queue[i];
  const n = e && e.n, dir = e && e.dir;
  const mode = e ? modeFor(n, dir) : null;

  const opts = useMemo(() => {
    if (!e || mode !== 'choice') return [];
    const mine = aText(n, dir);
    let others = pool.filter(x => x.id !== n.id && aText(x, dir) && aText(x, dir) !== mine);
    /* keep the choices plausible: same card type first */
    const same = others.filter(x => x.type === n.type);
    if (same.length >= 3) others = same;
    return shuffle([n, ...shuffle(others).slice(0, 3)]);
  }, [e && n.id, dir, mode]);

  if (!e) return null;

  const advance = (grade) => {
    onGrade(n.id, grade, dir);
    const next = { done: stats.done + 1, again: stats.again + (grade === 0 ? 1 : 0) };
    setStats(next);
    /* a card you got wrong comes back later in the same session */
    const q = grade === 0 ? [...queue, e] : queue;
    if (i + 1 >= q.length) { onDone(next); return; }
    setQueue(q); setI(i + 1);
    setRevealed(false); setSeen(false); setSel(null); setVal(''); setJudged(null);
  };

  const pickChoice = (o) => {
    if (sel) return;
    setSel(o);
    const ok = o.id === n.id;
    timer.current = setTimeout(() => advance(ok ? 2 : 0), ok ? 450 : 1300);
  };

  const submitTyped = (ev) => {
    ev.preventDefault();
    if (judged !== null || !val.trim()) return;
    setJudged(answerMatches(val, n.back));
  };

  /* 뜻 cards may show the reading under the question; the other two never do
     (it would give the answer away, or it IS the answer) */
  const showReadingOnQ = dir === 'mean' && furigana && n.reading;
  const question = qText(n, dir);
  const answer = aText(n, dir);
  const big = question.length > 10 ? ' sm' : '';

  const header = (
    <div className="rv-bar">
      <button className="btn btn-ghost btn-sm" onClick={onExit}>← 그만</button>
      <span className="fc-count">
        <span className={`dir-chip dir-${dir}`}>{DIRS[dir].short}</span>
        {NOTE_TYPES[n.type].label} · 남은 {queue.length - i}장
      </span>
    </div>
  );

  /* ── new card: show it, then rate it ── */
  if (mode === 'flash') {
    return (
      <div className="content">
        {header}
        <div className="new-badge">처음 보는 카드</div>
        <div className="fc-wrap" onClick={() => { setRevealed(r => !r); setSeen(true); }}>
          <div className={`fc${revealed ? ' flipped' : ''}`} key={n.id + dir}>
            <div className="fc-face fc-front">
              <div className="fc-hint">{seen ? '탭하면 다시 뒤집혀요' : DIRS[dir].ask}</div>
              <div className="fc-kana" style={{fontSize: question.length > 8 ? 26 : 50}}>{question}</div>
              {showReadingOnQ && <div className="fc-tag">{n.reading}</div>}
            </div>
            <div className="fc-face fc-back">
              <div style={{fontSize: answer.length > 14 ? 17 : 22, fontWeight:700, padding:'0 18px', textAlign:'center'}}>{answer}</div>
              {dir !== 'read' && n.reading && <div className="fc-tag" style={{marginTop:8}}>{n.reading}</div>}
              {dir === 'recall' && <div className="fc-tag" style={{marginTop:4}}>{n.back}</div>}
              {n.extra && <div className="fc-tag" style={{marginTop:8, padding:'0 20px', textAlign:'center'}}>{n.extra}</div>}
            </div>
          </div>
        </div>
        {seen ? <GradeRow note={n} dir={dir} onGrade={advance} /> : (
          <div className="tip-card" style={{textAlign:'center'}}>
            <div className="tip-text">답을 떠올려 본 다음 카드를 탭하세요.</div>
          </div>
        )}
      </div>
    );
  }

  /* ── familiar card: pick the answer ── */
  if (mode === 'choice') {
    return (
      <div className="content">
        {header}
        <div className="quiz-q-card">
          <div className="quiz-eyebrow">{DIRS[dir].ask}</div>
          <div className={`rv-q${big}`}>{question}</div>
          {showReadingOnQ && <div className="rv-sub">{n.reading}</div>}
        </div>
        <div className="quiz-grid">
          {opts.map(o => {
            let cls = 'quiz-opt' + (dir === 'mean' ? '' : ' ja');
            if (sel) {
              if (o.id === n.id) cls += ' correct';
              else if (sel.id === o.id) cls += ' wrong';
            }
            return (
              <button key={o.id} className={cls} disabled={!!sel} onClick={() => pickChoice(o)}>
                {aText(o, dir)}
              </button>
            );
          })}
        </div>
        {sel && dir !== 'mean' && (
          <div className="tip-card" style={{marginTop:10, textAlign:'center'}}>
            <div className="tip-text">{n.front}{n.reading ? ` · ${n.reading}` : ''} — {n.back}</div>
          </div>
        )}
      </div>
    );
  }

  /* ── well known: write the meaning from memory ── */
  return (
    <div className="content">
      {header}
      <div className="quiz-q-card">
        <div className="quiz-eyebrow">뜻을 입력하세요</div>
        <div className={`rv-q${big}`}>{question}</div>
        {showReadingOnQ && <div className="rv-sub">{n.reading}</div>}
      </div>
      {judged === null ? (
        <form onSubmit={submitTyped}>
          <input className="field-input" value={val} autoFocus placeholder="뜻을 한국어로"
            onChange={ev => setVal(ev.target.value)} />
          <button className="btn btn-primary" style={{marginTop:10}} type="submit" disabled={!val.trim()}>확인</button>
        </form>
      ) : (
        <>
          <div className={`ans-box ${judged ? 'ok' : 'ng'}`}>
            <div className="ans-label">{judged ? '정답이에요' : '정답은'}</div>
            <div className="ans-val">{n.back}</div>
            {n.reading && <div style={{fontSize:12, marginTop:6, opacity:0.8}}>{n.front} · {n.reading}</div>}
            {!judged && <div style={{fontSize:12, marginTop:4, opacity:0.8}}>입력: {val}</div>}
          </div>
          {judged
            ? <GradeRow note={n} dir={dir} onGrade={advance} hideAgain />
            : (
              <>
                <button className="btn btn-primary" onClick={() => advance(0)}>다시 볼게요</button>
                <button className="btn btn-ghost" style={{width:'100%', marginTop:8, padding:12}}
                  onClick={() => advance(2)}>사실 맞았어요</button>
              </>
            )}
        </>
      )}
    </div>
  );
}

/* the four scheduling buttons, each showing when the card returns */
function GradeRow({ note, dir, onGrade, hideAgain }) {
  const rows = hideAgain ? GRADES.slice(1) : GRADES;
  return (
    <div className="grade-row">
      {rows.map(({ g, label, cls }) => (
        <button key={g} className={`grade-btn ${cls}`} onClick={() => onGrade(g)}>
          <span className="grade-label">{label}</span>
          <span className="grade-when">{ivlLabel(previewIvl(note, g, dir))}</span>
        </button>
      ))}
    </div>
  );
}

/* ── Today tab ─────────────────────────────────────────────────────────── */
function TodayTab({ state, setState, showToast, studying, setStudying }) {
  const notes = (state.notes || []).filter(n => state.coreOnly === false || n.lv !== 'lit');
  const today = todayStr();
  const daily = state.daily && state.daily.date === today
    ? state.daily : { date: today, newDone: 0, reviewDone: 0 };
  const perDay = state.newPerDay || DEFAULT_NEW_PER_DAY;
  const dirs = activeDirs(state);
  const furigana = state.furigana !== false;
  const { review, fresh, freshTotal, total } = dueSplit(notes, perDay - daily.newDone, dirs);
  const waiting = review.length + fresh.length;

  const grade = (id, g, dir) => {
    const target = (state.notes || []).find(x => x.id === id);
    const wasNew = !sget(target, dir, 'reps');
    const d = state.daily && state.daily.date === today
      ? { ...state.daily } : { date: today, newDone: 0, reviewDone: 0 };
    if (wasNew) d.newDone += 1; else d.reviewDone += 1;

    let streak = state.streak || 0;
    const last = state.lastStudy;
    if (last !== today) streak = last && daysBetween(last, today) === 1 ? streak + 1 : 1;

    setState({
      ...state,
      notes: state.notes.map(x => x.id === id ? schedule(x, g, dir) : x),
      daily: d, streak, lastStudy: today,
    });
  };

  if (studying) {
    return (
      <StudySession
        key={studying.id}
        queue={studying.queue}
        pool={notes}
        furigana={furigana}
        onGrade={grade}
        onExit={() => setStudying(null)}
        onDone={(s) => { setStudying(null); showToast(`${s.done}장 완료 ✓`); }}
      />
    );
  }

  const start = () => {
    const q = shuffle([...review, ...fresh]);
    if (!q.length) return;
    setStudying({ id: Date.now(), queue: q });
  };

  const setDir = (d, on) => setState({ ...state, dirs: { ...(state.dirs || {}), [d]: on } });

  if (!notes.length) {
    return (
      <div className="content">
        <div className="card">
          <div className="empty-wrap">
            <div className="empty-ja">筆</div>
            <div className="empty-text">
              아직 카드가 없어요.<br/>수업 탭에서 노트를 불러오면 여기에 복습이 뜹니다.
            </div>
          </div>
        </div>
      </div>
    );
  }

  const fc = forecast(notes, 7, dirs);
  const dowNames = ['일','월','화','수','목','금','토'];
  const maxFc = Math.max(1, ...fc);
  const longTerm = entriesOf(notes, dirs).filter(e => (sget(e.n, e.dir, 'ivl') || 0) >= 21).length;

  return (
    <div className="content">
      <div className="today-hero">
        <div className="hero-eyebrow">오늘 복습</div>
        <div className="hero-num">{waiting}</div>
        <div className="hero-split">
          <span>복습 {review.length}장</span>
          <span className="hero-dot" />
          <span>새 카드 {fresh.length}장</span>
        </div>
        <button className="btn hero-btn" disabled={!waiting} onClick={start}>
          {waiting ? '시작하기' : '오늘은 다 했어요 ✓'}
        </button>
      </div>

      <div className="stat-row">
        <div className="stat-tile">
          <div className="stat-num">{state.streak || 0}</div>
          <div className="stat-label">연속일</div>
        </div>
        <div className="stat-tile">
          <div className="stat-num">{daily.newDone + daily.reviewDone}</div>
          <div className="stat-label">오늘 한 장</div>
        </div>
        <div className="stat-tile">
          <div className="stat-num">{longTerm}</div>
          <div className="stat-label">장기 기억</div>
        </div>
      </div>

      {/* ── what gets tested ── */}
      <div className="card">
        <div className="section-title" style={{marginBottom:4}}>테스트 방향</div>
        <div className="tip-text" style={{marginBottom:14}}>
          방향마다 따로 기억합니다. 뜻은 아는데 못 읽는 한자를 정확히 잡아내요.
        </div>
        {DIR_KEYS.map(d => {
          const on = dirs.includes(d);
          const count = notes.filter(n => dirApplies(n, d)).length;
          return (
            <button key={d} className={`dir-row${on ? ' on' : ''}`}
              disabled={d === 'mean'}
              onClick={() => setDir(d, !on)}>
              <span className={`dir-chip dir-${d}`}>{DIRS[d].short}</span>
              <span style={{minWidth:0, flex:1}}>
                <span className="dir-name">{DIRS[d].label}</span>
                <span className="dir-desc">
                  {d === 'mean' ? '일본어를 보고 뜻 맞히기 · 항상 켜짐'
                   : d === 'read' ? '한자를 히라가나로 읽기'
                   : '한국어 뜻을 보고 일본어 고르기'}
                </span>
              </span>
              <span className="dir-count">{count}장</span>
            </button>
          );
        })}
      </div>

      {/* ── furigana ── */}
      <div className="card">
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10}}>
          <span style={{fontSize:14, fontWeight:600}}>후리가나 (읽는 법)</span>
        </div>
        <div className="toggle-wrap" style={{marginBottom:10}}>
          <button className={`toggle-btn${furigana ? ' active' : ''}`}
            onClick={() => setState({ ...state, furigana: true })}>보이기</button>
          <button className={`toggle-btn${!furigana ? ' active' : ''}`}
            onClick={() => setState({ ...state, furigana: false })}>숨기기</button>
        </div>
        <div className="tip-text">
          {furigana
            ? '뜻 문제에서 한자 아래 읽는 법이 같이 보여요.'
            : '뜻 문제에서 한자만 나와요. 정답을 확인할 때 읽는 법이 함께 나옵니다.'}
        </div>
      </div>

      <div className="card">
        <div className="section-title" style={{marginBottom:12}}>앞으로 7일</div>
        <div className="fc-chart">
          {fc.map((c, k) => {
            const d = new Date(Date.now() + (k+1) * DAY);
            return (
              <div className="fc-col" key={k}>
                <span className="fc-val">{c || ''}</span>
                <div className="fc-bar" style={{height: `${Math.max(3, c / maxFc * 54)}px`}} />
                <span className="fc-day">{dowNames[d.getDay()]}</span>
              </div>
            );
          })}
        </div>
      </div>

      <div className="card">
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10}}>
          <span style={{fontSize:14, fontWeight:600}}>하루 새 카드</span>
          <span style={{fontFamily:'Georgia,serif', fontSize:20, color:'var(--rose)'}}>{perDay}장</span>
        </div>
        <div className="tabs">
          {[10, 20, 30, 40].map(v => (
            <button key={v} className={`tab${perDay === v ? ' active' : ''}`}
              onClick={() => setState({ ...state, newPerDay: v })}>{v}장</button>
          ))}
        </div>
        <div className="tip-text" style={{marginTop:10}}>
          켜 둔 방향을 합치면 모두 {total}장이고, 아직 안 배운 게 {freshTotal}장이에요.
          하루 {perDay}장이면 약 {Math.ceil(freshTotal / perDay)}일이면 다 봅니다.
        </div>
      </div>
    </div>
  );
}

/* ── Main App ──────────────────────────────────────────────────────────── */
function App() {
  const [appState, setAppState] = useState(null);
  const [tab, setTab] = useState('today');
  const [studying, setStudying] = useState(null);
  const [toast, setToast] = useState('');

  useEffect(() => {
    const s = loadState();
    if (s?.p1 && s?.p2) setAppState({ ...s, notes: backfillDecks(s.notes || []) });
  }, []);

  const updateState = useCallback(next => { setAppState(next); saveState(next); }, []);

  const showToast = msg => {
    setToast(msg);
    setTimeout(() => setToast(''), 1800);
  };

  if (!appState?.p1) return (
    <SetupScreen onComplete={(p1, p2) => {
      updateState({ p1, p2, streak:0, learned:[], p1Learned:[], p2Learned:[], quizWins:0, hiragana:[], katakana:[], notes:[] });
    }} />
  );

  const tabs = [
    { id:'today',  icon:'🔥', label:'오늘' },
    { id:'notes',  icon:'📚', label:'수업' },
    { id:'kana',   icon:'あ',  label:'문자' },
  ];

  const HEADER_TITLES = {
    today: { main:'오늘', accent:'복습' },
    notes: { main:'수업', accent:'노트' },
    kana:  { main:'가나', accent:'あ ア' },
  };
  const ht = HEADER_TITLES[tab];

  return (
    <div className="app">
      <Toast msg={toast} />

      <header className="header">
        <div>
          <div className="header-title">{ht.main} <span>{ht.accent}</span></div>
          <div className="header-sub">{appState.p1} · {appState.p2}</div>
        </div>
        <div className="header-mark" style={{color:'var(--rose)'}}>
          <svg width="18" height="18" viewBox="0 0 96 96" fill="none">
            <circle cx="36" cy="48" r="28" stroke="currentColor" strokeWidth="4" opacity="0.25"/>
            <circle cx="60" cy="48" r="28" stroke="currentColor" strokeWidth="4" opacity="0.25"/>
          </svg>
        </div>
      </header>

      {tab==='today'  && <TodayTab state={appState} setState={updateState} showToast={showToast}
                            studying={studying} setStudying={setStudying} />}
      {tab==='notes'  && <NotesTab state={appState} setState={updateState} showToast={showToast} />}
      {tab==='kana'   && <KanaTab  state={appState} setState={updateState} showToast={showToast} />}

      <nav className="nav">
        {tabs.map(t => (
          <button key={t.id} className={`nav-btn${tab===t.id?' active':''}`}
            onClick={() => { if (t.id !== 'today') setStudying(null); setTab(t.id); }}>
            <span className="nav-icon">{t.icon}</span>
            <span className="nav-label">{t.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
