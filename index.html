<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="우리 둘이 일본어" />
  <meta name="theme-color" content="#bf3a57" />
  <meta name="description" content="부부가 함께 일본어를 배우는 커플 학습 앱" />
  <link rel="manifest" href="manifest.json" />
  <title>우리 둘이 일본어</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ── Tokens ─────────────────────────────────────────────────────────── */
    :root {
      --bg:        #f5f0eb;
      --surface:   #ffffff;
      --surface-2: #faf7f3;
      --rose:      #bf3a57;
      --rose-lt:   #fceaee;
      --rose-dk:   #8c1f36;
      --plum:      #3a2850;
      --plum-lt:   #ede8f5;
      --ink:       #1a1118;
      --ink-2:     #6b5a70;
      --ink-3:     #aaa0b0;
      --border:    #e6dce4;
      --shadow:    rgba(50,15,40,0.07);
      --ok:        #2e7d4f;
      --ok-lt:     #e8f5ed;
      --err:       #c0392b;
      --err-lt:    #fde8e6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #150f18;
        --surface:   #201720;
        --surface-2: #281e2c;
        --rose:      #e05a75;
        --rose-lt:   #3a1a26;
        --rose-dk:   #f07090;
        --plum:      #9570c0;
        --plum-lt:   #261e36;
        --ink:       #f0eaf5;
        --ink-2:     #b8a8c2;
        --ink-3:     #6e5e7a;
        --border:    #352538;
        --shadow:    rgba(0,0,0,0.3);
        --ok:        #4caf73;
        --ok-lt:     #1a3a27;
        --err:       #e05545;
        --err-lt:    #3a1a18;
      }
    }
    :root[data-theme="light"] {
      --bg:#f5f0eb; --surface:#ffffff; --surface-2:#faf7f3;
      --rose:#bf3a57; --rose-lt:#fceaee; --rose-dk:#8c1f36;
      --plum:#3a2850; --plum-lt:#ede8f5;
      --ink:#1a1118; --ink-2:#6b5a70; --ink-3:#aaa0b0;
      --border:#e6dce4; --shadow:rgba(50,15,40,0.07);
      --ok:#2e7d4f; --ok-lt:#e8f5ed; --err:#c0392b; --err-lt:#fde8e6;
    }
    :root[data-theme="dark"] {
      --bg:#150f18; --surface:#201720; --surface-2:#281e2c;
      --rose:#e05a75; --rose-lt:#3a1a26; --rose-dk:#f07090;
      --plum:#9570c0; --plum-lt:#261e36;
      --ink:#f0eaf5; --ink-2:#b8a8c2; --ink-3:#6e5e7a;
      --border:#352538; --shadow:rgba(0,0,0,0.3);
      --ok:#4caf73; --ok-lt:#1a3a27; --err:#e05545; --err-lt:#3a1a18;
    }

    /* ── Reset & Base ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overscroll-behavior: none;
      transition: background 0.2s, color 0.2s;
    }
    button, input { font-family: inherit; }
    button { cursor: pointer; border: none; background: none; }

    /* ── Layout shell ───────────────────────────────────────────────────── */
    .app {
      max-width: 480px; margin: 0 auto;
      min-height: 100vh; min-height: -webkit-fill-available;
      position: relative; display: flex; flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: calc(14px + env(safe-area-inset-top)) 20px 13px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .header-title {
      font-size: 17px; font-weight: 700; letter-spacing: -0.3px;
      color: var(--ink);
    }
    .header-title span { color: var(--rose); }
    .header-sub {
      font-size: 11px; color: var(--ink-3); margin-top: 1px;
      letter-spacing: 0.2px;
    }
    .header-mark {
      width: 34px; height: 34px;
      border: 1.5px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    /* ── Content ────────────────────────────────────────────────────────── */
    .content {
      flex: 1;
      padding: 20px 16px calc(84px + env(safe-area-inset-bottom));
      overflow-y: auto;
    }

    /* ── Cards ──────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px var(--shadow);
    }
    .card-flat {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    /* ── Buttons ────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; border-radius: 12px;
      font-size: 15px; font-weight: 600;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--rose);
      color: #fff;
      padding: 15px 24px; width: 100%;
      box-shadow: 0 4px 18px rgba(191,58,87,0.35);
      letter-spacing: 0.2px;
    }
    .btn-primary:hover { box-shadow: 0 6px 22px rgba(191,58,87,0.45); }
    .btn-primary:disabled { opacity: 0.4; pointer-events: none; }
    .btn-ghost {
      background: var(--surface-2);
      color: var(--ink-2);
      padding: 10px 18px;
      border: 1px solid var(--border);
    }
    .btn-ghost-rose {
      background: var(--rose-lt);
      color: var(--rose);
      padding: 10px 18px;
      border: 1px solid color-mix(in srgb, var(--rose) 20%, transparent);
    }
    .btn-ghost-plum {
      background: var(--plum-lt);
      color: var(--plum);
      padding: 10px 18px;
      border: 1px solid color-mix(in srgb, var(--plum) 20%, transparent);
    }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }

    /* ── Bottom nav ─────────────────────────────────────────────────────── */
    .nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 8px 8px max(10px, env(safe-area-inset-bottom));
      z-index: 100;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; min-width: 60px; padding: 6px 8px;
      border-radius: 14px; transition: background 0.18s;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-btn.active { background: var(--rose-lt); }
    .nav-icon { font-size: 20px; line-height: 1; }
    .nav-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
      color: var(--ink-3); transition: color 0.18s;
    }
    .nav-btn.active .nav-label { color: var(--rose); }

    /* ── Section headings ───────────────────────────────────────────────── */
    .section-title {
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.6px; text-transform: uppercase;
      color: var(--ink-3); margin-bottom: 10px;
    }

    /* ── Progress bar ───────────────────────────────────────────────────── */
    .prog-track { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .prog-fill {
      height: 100%; border-radius: 3px;
      background: var(--rose);
      transition: width 0.4s ease;
    }

    /* ── Pill tabs ──────────────────────────────────────────────────────── */
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      white-space: nowrap; padding: 7px 15px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
      background: var(--surface-2); color: var(--ink-3);
      border: 1px solid var(--border);
      transition: all 0.18s;
    }
    .tab.active { background: var(--rose); color: #fff; border-color: transparent; }

    /* ── Mode toggle ────────────────────────────────────────────────────── */
    .toggle-wrap {
      display: grid; grid-template-columns: 1fr 1fr;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 16px;
    }
    .toggle-btn {
      padding: 9px; border-radius: 9px; font-size: 14px; font-weight: 600;
      color: var(--ink-3); transition: all 0.18s;
    }
    .toggle-wrap.three { grid-template-columns: 1fr 1fr 1fr; }
    .toggle-wrap.three .toggle-btn { font-size: 12.5px; padding: 9px 4px; }
    .quiz-opt.kana {
      font-family: Georgia, 'Hiragino Mincho ProN', serif;
      font-size: 30px; padding: 14px 10px;
    }
    .toggle-btn.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 6px var(--shadow); }

    /* ── Setup screen ───────────────────────────────────────────────────── */
    .setup-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center;
      min-height: 100vh; min-height: -webkit-fill-available;
      padding: 48px 28px;
      background: var(--bg);
    }
    .setup-mark { margin-bottom: 24px; }
    .setup-kicker {
      font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase;
      color: var(--rose); font-weight: 700; margin-bottom: 8px;
    }
    .setup-title {
      font-family: Georgia, 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      font-size: 28px; font-weight: normal;
      color: var(--ink); line-height: 1.25;
      text-align: center; text-wrap: balance;
      margin-bottom: 6px;
    }
    .setup-ja {
      font-family: Georgia, 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      font-size: 14px; color: var(--ink-3); margin-bottom: 40px;
      letter-spacing: 2px;
    }
    .setup-form { width: 100%; max-width: 340px; }
    .field-group { margin-bottom: 16px; }
    .field-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; color: var(--ink-3); margin-bottom: 7px;
      display: block;
    }
    .field-input {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 16px;
      color: var(--ink);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    .field-input::placeholder { color: var(--ink-3); }
    .field-input:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px var(--rose-lt);
    }

    /* ── Flashcard ──────────────────────────────────────────────────────── */
    .fc-wrap { perspective: 1200px; height: 230px; margin-bottom: 14px; }
    .fc {
      width: 100%; height: 100%; position: relative;
      transform-style: preserve-3d; transition: transform 0.48s cubic-bezier(.4,0,.2,1);
      cursor: pointer;
    }
    .fc.flipped { transform: rotateY(180deg); }
    .fc-face {
      position: absolute; width: 100%; height: 100%;
      border-radius: 20px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      backface-visibility: hidden;
    }
    .fc-front {
      background: var(--rose);
      color: #fff;
    }
    .fc-back {
      background: var(--plum);
      color: #fff;
      transform: rotateY(180deg);
    }
    .fc-hint { font-size: 11px; opacity: 0.6; margin-bottom: 10px; letter-spacing: 0.5px; }
    .fc-kana {
      font-family: Georgia, 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      font-size: 64px; line-height: 1; margin-bottom: 6px;
    }
    .fc-tag { font-size: 12px; opacity: 0.55; letter-spacing: 0.5px; }
    .fc-romaji { font-size: 32px; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; }
    .fc-meaning { font-size: 20px; opacity: 0.9; }

    /* ── Vocab grid ─────────────────────────────────────────────────────── */
    .vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .vocab-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 16px 10px;
      text-align: center; cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .vocab-card:active { transform: scale(0.97); }
    .vocab-kana {
      font-family: Georgia, 'Hiragino Mincho ProN', serif;
      font-size: 24px; margin-bottom: 5px; color: var(--ink);
    }
    .vocab-korean { font-size: 12px; color: var(--ink-2); font-weight: 500; }
    .vocab-romaji { font-size: 10px; color: var(--ink-3); margin-top: 2px; }
    .vocab-checks { display: flex; gap: 4px; justify-content: center; margin-top: 6px; }
    .v-check {
      font-size: 10px; padding: 2px 6px; border-radius: 6px;
      background: var(--rose-lt); color: var(--rose); font-weight: 600;
    }
    .v-check.plum { background: var(--plum-lt); color: var(--plum); }

    /* ── Today word ─────────────────────────────────────────────────────── */
    .today-card {
      background: var(--plum);
      border-radius: 18px; padding: 24px 20px;
      color: #fff; text-align: center;
      position: relative; overflow: hidden;
    }
    .today-card::before {
      content: '二'; position: absolute;
      font-family: Georgia, serif; font-size: 140px;
      color: rgba(255,255,255,0.04);
      right: -20px; top: -20px; line-height: 1;
      pointer-events: none;
    }
    .today-eyebrow {
      font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
      opacity: 0.55; margin-bottom: 12px; font-weight: 600;
    }
    .today-kana {
      font-family: Georgia, 'Hiragino Mincho ProN', serif;
      font-size: 56px; line-height: 1; margin-bottom: 10px;
    }
    .today-korean { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .today-romaji { font-size: 13px; opacity: 0.55; letter-spacing: 0.5px; }

    /* ── Stat row ───────────────────────────────────────────────────────── */
    .stat-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .stat-tile {
      flex: 1; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 10px; text-align: center;
    }
    .stat-num {
      font-family: Georgia, serif;
      font-size: 28px; font-weight: normal;
      color: var(--rose); line-height: 1; margin-bottom: 4px;
    }
    .stat-label { font-size: 10px; color: var(--ink-3); letter-spacing: 0.4px; font-weight: 600; text-transform: uppercase; }

    /* ── Banner card ────────────────────────────────────────────────────── */
    .banner {
      background: var(--rose);
      border-radius: 18px; padding: 18px 20px;
      color: #fff; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .banner-text { font-size: 12px; opacity: 0.8; margin-bottom: 3px; }
    .banner-name { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .banner-ja {
      font-family: Georgia, serif;
      font-size: 36px; opacity: 0.25; line-height: 1;
    }

    /* ── Partner progress row ───────────────────────────────────────────── */
    .partner-row { margin-bottom: 14px; }
    .partner-meta {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 6px;
    }
    .partner-name { font-size: 14px; font-weight: 600; color: var(--ink); }
    .partner-count { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .partner-row:last-child { margin-bottom: 0; }

    /* ── Quiz ───────────────────────────────────────────────────────────── */
    .quiz-scorebar {
      background: var(--rose);
      border-radius: 16px; padding: 14px 20px; color: #fff;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .quiz-scorebar.plum { background: var(--plum); }
    .quiz-score-block { text-align: center; }
    .quiz-score-name { font-size: 11px; opacity: 0.7; margin-bottom: 2px; }
    .quiz-score-num { font-family: Georgia, serif; font-size: 32px; line-height: 1; }
    .quiz-mid { font-size: 12px; text-align: center; opacity: 0.8; line-height: 1.5; }
    .quiz-q-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 28px 20px;
      text-align: center; margin-bottom: 12px;
    }
    .quiz-eyebrow { font-size: 11px; color: var(--ink-3); letter-spacing: 0.5px; margin-bottom: 8px; }
    .quiz-kana {
      font-family: Georgia, 'Hiragino Mincho ProN', serif;
      font-size: 56px; color: var(--ink); margin-bottom: 6px; line-height: 1;
    }
    .quiz-romaji { font-size: 13px; color: var(--ink-3); letter-spacing: 0.5px; }
    .quiz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .quiz-opt {
      padding: 16px 10px; border-radius: 14px;
      border: 1.5px solid var(--border); background: var(--surface);
      font-size: 14px; font-weight: 600; color: var(--ink);
      transition: all 0.18s; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .quiz-opt:active:not([disabled]) { transform: scale(0.96); }
    .quiz-opt.correct { background: var(--ok-lt); border-color: var(--ok); color: var(--ok); }
    .quiz-opt.wrong { background: var(--err-lt); border-color: var(--err); color: var(--err); }
    .quiz-opt:disabled { cursor: not-allowed; }
    .quiz-rule { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
    .quiz-rule-num { color: var(--rose); font-weight: 700; font-size: 14px; flex-shrink: 0; }
    .quiz-rule-text { font-size: 13px; color: var(--ink-2); line-height: 1.5; }

    /* ── Hiragana ───────────────────────────────────────────────────────── */
    .hira-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    }
    .hira-cell {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 4px;
      text-align: center; cursor: pointer; transition: all 0.18s;
    }
    .hira-cell:active { transform: scale(0.93); }
    .hira-cell.learned { background: var(--rose); border-color: transparent; }
    .hira-char {
      font-family: Georgia, 'Hiragino Mincho ProN', serif;
      font-size: 22px; color: var(--ink); display: block; line-height: 1;
    }
    .hira-cell.learned .hira-char { color: #fff; }
    .hira-rom {
      font-size: 9px; color: var(--ink-3); margin-top: 3px;
      display: block; letter-spacing: 0.3px;
    }
    .hira-cell.learned .hira-rom { color: rgba(255,255,255,0.65); }

    /* ── Tip card ───────────────────────────────────────────────────────── */
    .tip-card {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 16px;
    }
    .tip-label { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
    .tip-text { font-size: 13px; color: var(--ink-2); line-height: 1.65; }

    /* ── Toast ──────────────────────────────────────────────────────────── */
    .toast {
      position: fixed; top: calc(20px + env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%) translateY(-10px);
      background: var(--ink); color: var(--bg);
      padding: 11px 22px; border-radius: 30px;
      font-size: 14px; font-weight: 600;
      z-index: 999; opacity: 0;
      transition: opacity 0.22s, transform 0.22s;
      white-space: nowrap; letter-spacing: 0.2px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Nav card controls ──────────────────────────────────────────────── */
    .fc-controls {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .fc-count { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

    /* ── Result screen ──────────────────────────────────────────────────── */
    .result-vs { display: flex; align-items: center; justify-content: space-around; padding: 10px 0; }
    .result-score-block { text-align: center; }
    .result-score-name { font-size: 12px; color: var(--ink-3); margin-bottom: 4px; }
    .result-score-num {
      font-family: Georgia, serif; font-size: 52px; font-weight: normal;
      color: var(--rose); line-height: 1;
    }
    .result-score-num.plum { color: var(--plum); }
    .result-vs-sep { font-size: 18px; color: var(--border); font-weight: 700; }

    /* ── Notes: type cards ──────────────────────────────────────────────── */
    .nt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .nt-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 15px 14px; text-align: left; width: 100%;
      transition: transform 0.16s, border-color 0.16s, background 0.16s;
    }
    .nt-card:active { transform: scale(0.97); }

   2 fields → 앞/뜻, 3 → 앞/읽기/뜻, 4+ → 앞/읽기/뜻/메모 */
function parseNoteText(text, type) {
  const out = [];
  (text||'').split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line || line.startsWith('#') || line.startsWith('//')) return;
    const p = line.split(/\s*[\/|\t,;]\s*|\s{2,}/).map(s => s.trim()).filter(Boolean);
    if (p.length < 2) return;
    if (p.length === 2)      out.push(makeNote(type, p[0], '',   p[1], ''));
    else                     out.push(makeNote(type, p[0], p[1], p[2], p.slice(3).join(' · ')));
  });
  return out;
}

}
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = Array.from({length:n+1}, (_,j) => j);
  let cur  = new Array(n+1);
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1] ? 0 : 1));
    }
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}
function answerMatches(input, answer) {
  const a = normAns(input);
  if (!a) return false;
  // accept any alternative separated by / , · or 또는
  const alts = String(answer||'').split(/[\/,·]|또는/).map(normAns).filter(Boolean);
  if (!alts.length) return false;
  return alts.some(b => {
    if (a === b) return true;
    const short = Math.min(a.length, b.length), long = Math.max(a.length, b.length);
    // one contains the other, and the shorter side still carries most of the answer
    if (b.length >= 2 && (b.includes(a) || a.includes(b))
        && short >= Math.max(2, Math.ceil(long * 0.5))) return true;
    // allow a single typo once the answer is long enough to afford one
    const tol = Math.max(long >= 4 ? 1 : 0, Math.floor(long * 0.25));
    return levenshtein(a, b) <= tol;
  });
}

/* ── SRS (Leitner) ─────────────────────────────────────────────────────── */
function gradeNote(note, correct) {
  return {
    ...note,
    box: correct ? Math.min(MAX_BOX, (note.box||1) + 1) : 1,
    ok:  (note.ok||0) + (correct ? 1 : 0),
    ng:  (note.ng||0) + (correct ? 0 : 1),
  };
}
/* Weakest cards first, so review time goes where it is needed */
function studyOrder(notes) {
  return shuffle(notes).sort((x, y) => (x.box||1) - (y.box||1));
}

function QuizTab({ state, setState, showToast }) {
  const [phase, setPhase] = useState('intro');
  const [player, setPlayer] = useState(1);
  const [scores, setScores] = useState({1:0, 2:0});
  const [round, setRound] = useState(0);
  const ROUNDS = 10;
  const [qs, setQs] = useState([]);
  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState(false);

  const startQuiz = () => {
    const pool = shuffle(ALL_VOCAB).slice(0, ROUNDS).map(word => ({
      word, options: shuffle([word, ...shuffle(ALL_VOCAB.filter(w=>w.kana!==word.kana)).slice(0,3)])
    }));
    setQs(pool); setRound(0); setScores({1:0,2:0}); setPlayer(1);
    setSelected(null); setAnswered(false); setPhase('playing');
  };

  const q = qs[round];

  const handleAnswer = (opt) => {
    if (answered) return;
    setSelected(opt); setAnswered(true);
    const correct = opt.kana === q.word.kana;
    if (correct) { setScores(s=>({...s,[player]:s[player]+1})); showToast('정답! 🎉'); }
    else showToast('아쉬워요 😅');
    setTimeout(() => {
      if (round+1 >= ROUNDS) { setPhase('result'); return; }
      setRound(r=>r+1); setPlayer(p=>p===1?2:1); setSelected(null); setAnswered(false);
    }, 1200);
  };

  if (phase === 'intro') return (
    <div className="content">
      <div className="section-title">커플 퀴즈 배틀</div>
      <div className="card" style={{textAlign:'center',padding:'32px 24px'}}>
        <div style={{fontSize:56,marginBottom:16}}>⚔️</div>
        <div style={{fontSize:20,fontWeight:700,marginBottom:8,color:'var(--ink)'}}>
          {state.p1} vs {state.p2}
        </div>
        <div style={{fontSize:14,color:'var(--ink-2)',marginBottom:28,lineHeight:1.7}}>
          번갈아가며 총 {ROUNDS}문제를 풀어요.<br/>누가 더 많이 맞힐까요?
        </div>
        <button className="btn btn-primary" onClick={startQuiz}>배틀 시작</button>
      </div>
      <div className="card" style={{marginTop:0}}>
        <div className="section-title" style={{marginBottom:12}}>게임 방법</div>
        {['일본어 단어를 보고 뜻을 고르세요','두 분이 번갈아가며 문제를 풀어요','정답이면 1점, 10문제 후 높은 점수 승리'].map((t,i)=>(
          <div key={i} className="quiz-rule">
            <span className="quiz-rule-num">{i+1}</span>
            <span className="quiz-rule-text">{t}</span>
          </div>
        ))}
      </div>
    </div>
  );

  if (phase === 'result') {
    const winner = scores[1]>scores[2]?state.p1:scores[2]>scores[1]?state.p2:null;
    return (
      <div className="content">
        <div className="section-title">결과 발표</div>
        <div className="card" style={{textAlign:'center',padding:'28px 24px'}}>
          <div style={{fontSize:52,marginBottom:12}}>{winner?'🏆':'🤝'}</div>
          <div style={{fontSize:22,fontWeight:700,marginBottom:6,color:'var(--ink)'}}>
            {winner ? `${winner} 승리!` : '무승부!'}
          </div>
          <div style={{fontSize:14,color:'var(--ink-3)',marginBottom:24}}>
            {winner ? '축하해요!' : '두 분 다 수고하셨어요!'}
          </div>
          <div className="result-vs" style={{marginBottom:28}}>
            <div className="result-score-block">
              <div className="result-score-name">{state.p1}</div>
              <div className="result-score-num">{scores[1]}</div>
            </div>
            <div className="result-vs-sep">VS</div>
            <div className="result-score-block">
              <div className="result-score-name">{state.p2}</div>
              <div className="result-score-num plum">{scores[2]}</div>
            </div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-ghost" style={{flex:1,padding:'13px'}}
              onClick={() => { setState({...state,quizWins:(state.quizWins||0)+(winner?1:0)}); setPhase('intro'); }}>
              홈으로

            <button className="btn btn-primary" style={{flex:1,padding:'13px'}}
              onClick={() => { setState({...state,quizWins:(state.quizWins||0)+(winner?1:0)}); startQuiz(); }}>
              다시 도전
            </button>
          </div>
        </div>
      </div>
    );
  }

  const isP1 = player === 1;
  return (
    <div className="content">
      <div className={`quiz-scorebar${isP1?'':' plum'}`}>
        <div className="quiz-score-block">
          <div className="quiz-score-name">{state.p1}</div>
          <div className="quiz-score-num">{scores[1]}</div>
        </div>
        <div className="quiz-mid">
          <div>{round+1} / {ROUNDS}</div>
          <div style={{marginTop:2}}>{isP1?state.p1:state.p2}의 차례</div>
        </div>
        <div className="quiz-score-block">
          <div className="quiz-score-name">{state.p2}</div>
          <div className="quiz-score-num">{scores[2]}</div>

              {opt.korean}

          );
        })}

    </div>
  );
}

/* ── Kana: flashcard ───────────────────────────────────────────────────── */
function KanaFlash({ rows, learned, onMark, onExit, label }) {
  /* unlearned first, so practice goes where it is needed */
  const [queue] = useState(() => {
    const a = shuffle(rows);
    return [...a.filter(r => !learned.has(r.char)), ...a.filter(r => learned.has(r.char))];
  });
  const [i, setI] = useState(0);
  const [flip, setFlip] = useState(false);
  const [right, setRight] = useState(0);
  const r = queue[i];
  if (!r) return null;

  const answer = (ok) => {
    onMark(r.char, ok);
    const n = right + (ok ? 1 : 0);
    if (i + 1 >= queue.length) { showKanaDone(onExit, n, queue.length); return; }
    setRight(n); setI(i + 1); setFlip(false);
  };

  return (
    <>
      <div className="rv-bar">
        <span className="fc-count">{label}</span>
        <span className="fc-count">{i + 1} / {queue.length}</span>
      </div>
      <div className="prog-track" style={{marginBottom:14}}>
        <div className="prog-fill" style={{width:`${(i / queue.length) * 100}%`}} />
      </div>

      <div className="fc-wrap" onClick={() => setFlip(f => !f)}>
        <div className={`fc${flip ? ' flipped' : ''}`}>
          <div className="fc-face fc-front">
            <div className="fc-hint">탭하면 뒤집어요</div>
            <div className="fc-kana" style={{fontSize:96}}>{r.char}</div>
          </div>
          <div className="fc-face fc-back">
            <div className="fc-romaji" style={{fontSize:52}}>{r.rom}</div>
            <div className="fc-tag">{kanaKeyOf(r.char) === 'hiragana' ? '히라가나' : '가타카나'}</div>
          </div>
        </div>
      </div>

      {flip ? (
        <div style={{display:'flex', gap:8}}>
          <button className="btn btn-ghost" style={{flex:1, padding:14}} onClick={() => answer(false)}>아직이에요</button>
          <button className="btn btn-ghost-rose" style={{flex:1, padding:14}} onClick={() => answer(true)}>알아요 ✓</button>
        </div>
      ) : (
        <div className="tip-card" style={{textAlign:'center'}}>
          <div className="tip-text">소리를 먼저 떠올린 다음 뒤집어 확인해 보세요.</div>
        </div>
      )}
    </>
  );
}

/* ── Kana: quiz ────────────────────────────────────────────────────────── */
function KanaQuiz({ rows, onMark, onExit, label }) {
  const total = Math.min(10, rows.length);
  const [queue] = useState(() =>
    shuffle(rows).slice(0, total).map(r => ({ r, dir: Math.random() < 0.5 ? 'k2r' : 'r2k' })));
  const [i, setI] = useState(0);
  const [sel, setSel] = useState(null);
  const [right, setRight] = useState(0);
  const [combo, setCombo] = useState(0);
  const timer = useTimeoutRef();
  const q = queue[i];

  const opts = useMemo(() => {
    if (!q) return [];
    const others = shuffle(rows.filter(x => x.rom !== q.r.rom)).slice(0, 3);
    return shuffle([q.r, ...others]);
  }, [i]);

  if (!q) return null;

  const pick = (o) => {
    if (sel) return;
    const ok = o.rom === q.r.rom;
    setSel(o);
    onMark(q.r.char, ok);
    const n = right + (ok ? 1 : 0);
    setCombo(ok ? combo + 1 : 0);
    timer.current = setTimeout(() => {
      if (i + 1 >= queue.length) { showKanaDone(onExit, n, queue.length); return; }
      setRight(n); setI(i + 1); setSel(null);
    }, 800);
  };

  const k2r = q.dir === 'k2r';
  return (
    <>
      <div className="rv-bar">
        <span className="fc-count">{label}</span>
        <span className="fc-count">
          {combo >= 2 && <span className="combo">{combo}연속 🔥 </span>}
          {i + 1} / {queue.length}
        </span>
      </div>
      <div className="prog-track" style={{marginBottom:14}}>
        <div className="prog-fill" style={{width:`${(i / queue.length) * 100}%`}} />
      </div>

      <div className="quiz-q-card">
        <div className="quiz-eyebrow">{k2r ? '이 글자의 소리는?' : '이 소리의 글자는?'}</div>
        <div className="rv-q" style={{fontSize: k2r ? 76 : 48, letterSpacing: k2r ? 0 : 2}}>
          {k2r ? q.r.char : q.r.rom}
        </div>
      </div>

      <div className="quiz-grid">
        {opts.map((o, n) => {
          let cls = 'quiz-opt' + (k2r ? '' : ' kana');
          if (sel) {
            if (o.rom === q.r.rom) cls += ' correct';
            else if (sel.rom === o.rom) cls += ' wrong';
          }
          return (
            <button key={n} className={cls} disabled={!!sel} onClick={() => pick(o)}>
              {k2r ? o.rom : o.char}
            </button>
          );
        })}
      </div>
    </>
  );
}

function showKanaDone(onExit, right, total) { onExit({ right, total }); }

/* ── Kana tab ──────────────────────────────────────────────────────────── */
function KanaTab({ state, setState, showToast }) {
  const [kind, setKind] = useState('hiragana');   // hiragana | katakana | mixed
  const [mode, setMode] = useState('chart');      // chart | flash | quiz
  const [result, setResult] = useState(null);
  const [runId, setRunId] = useState(0);

  const hira = HIRAGANA.filter(h => h.char);
  const kata = KATAKANA.filter(h => h.char);
  const rows = kind === 'hiragana' ? hira : kind === 'katakana' ? kata : [...hira, ...kata];
  const label = kind === 'hiragana' ? '히라가나' : kind === 'katakana' ? '가타카나' : '히라가나 + 가타카나';

  const learnedOf = (key) => new Set(state[key] || []);
  const allLearned = new Set([...(state.hiragana || []), ...(state.katakana || [])]);
  const done = rows.filter(r => allLearned.has(r.char)).length;
  const pct = rows.length ? Math.round(done / rows.length * 100) : 0;

  /* flip a single character in the chart */
  const toggle = (char) => {
    if (!char) return;
    const key = kanaKeyOf(char);
    const s = new Set(state[key] || []);
    if (s.has(char)) s.delete(char);
    else { s.add(char); showToast(`${char} ✓`); }
    setState({ ...state, [key]: [...s] });
  };
  /* quiz / flashcard grading: right marks it known, wrong clears it */
  const mark = (char, ok) => {
    const key = kanaKeyOf(char);
    const s = new Set(state[key] || []);
    if (ok) s.add(char); else s.delete(char);
    setState({ ...state, [key]: [...s] });
  };

  const start = (m) => { setMode(m); setResult(null); setRunId(r => r + 1); };

  const chart = (rowsData, title) => (
    <div className="card" key={title}>
      <div className="tip-text" style={{marginBottom:14}}>
        {title} — 글자를 탭하면 완료로 표시됩니다.
      </div>
      <div className="hira-grid">
        {rowsData.map((h, i) => (
          h.char ? (
            <div key={i} className={`hira-cell${allLearned.has(h.char) ? ' learned' : ''}`}
              onClick={() => toggle(h.char)}>
              <span className="hira-char">{h.char}</span>
              <span className="hira-rom">{h.rom}</span>
            </div>
          ) : <div key={i} />
        ))}
      </div>
    </div>
  );

  return (
    <div className="content">
      <div className="toggle-wrap three">
        <button className={`toggle-btn${kind === 'hiragana' ? ' active' : ''}`} onClick={() => setKind('hiragana')}>
          <span style={{fontFamily:'Georgia,serif', marginRight:4}}>あ</span>히라가나
        </button>
        <button className={`toggle-btn${kind === 'katakana' ? ' active' : ''}`} onClick={() => setKind('katakana')}>
          <span style={{fontFamily:'Georgia,serif', marginRight:4}}>ア</span>가타카나
        </button>
        <button className={`toggle-btn${kind === 'mixed' ? ' active' : ''}`} onClick={() => setKind('mixed')}>
          🔀 섞기
        </button>
      </div>

      <div className="toggle-wrap three">
        {KANA_MODES.map(m => (
          <button key={m.id} className={`toggle-btn${mode === m.id ? ' active' : ''}`}
            onClick={() => start(m.id)}>{m.label}</button>
        ))}
      </div>

      {result ? (
        <div className="card" style={{textAlign:'center', padding:30}}>
          <div className="empty-ja" style={{color:'var(--rose)'}}>
            {result.right === result.total ? '満' : '復'}
          </div>
          <div style={{fontFamily:'Georgia,serif', fontSize:52, color:'var(--rose)', lineHeight:1}}>
            {Math.round(result.right / result.total * 100)}%
          </div>
          <div style={{fontSize:14, color:'var(--ink-2)', marginTop:8}}>
            {result.total}개 중 {result.right}개 정답
          </div>
          <div style={{display:'flex', gap:8, marginTop:24}}>
            <button className="btn btn-ghost" style={{flex:1, padding:14}}
              onClick={() => { setResult(null); setMode('chart'); }}>표로</button>
            <button className="btn btn-ghost-rose" style={{flex:1, padding:14}}
              onClick={() => { setResult(null); setRunId(r => r + 1); }}>한 번 더</button>
          </div>
        </div>
      ) : mode === 'flash' ? (
        <KanaFlash key={runId} rows={rows} learned={allLearned} label={label}
          onMark={mark} onExit={setResult} />
      ) : mode === 'quiz' ? (
        <KanaQuiz key={runId} rows={rows} label={label}
          onMark={mark} onExit={setResult} />
      ) : (
        <>
          <div className="card" style={{marginBottom:12}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:8}}>
              <span style={{fontSize:14, fontWeight:600}}>{label} 진도</span>
              <span style={{fontFamily:'Georgia,serif', fontSize:22, color:'var(--rose)'}}>{pct}%</span>
            </div>
            <div className="prog-track"><div className="prog-fill" style={{width:`${pct}%`}} /></div>
            <div style={{fontSize:12, color:'var(--ink-3)', marginTop:8, fontVariantNumeric:'tabular-nums'}}>
              {done} / {rows.length} 글자 완료
            </div>
          </div>

          {kind === 'mixed'
            ? [chart(HIRAGANA, '히라가나'), chart(KATAKANA, '가타카나')]
            : chart(kind === 'hiragana' ? HIRAGANA : KATAKANA, label)}

          <div className="tip-card" style={{marginTop:12}}>
            <div className="tip-label">학습 팁</div>
            <div className="tip-text">
              {kind === 'hiragana'
                ? '히라가나는 일본어의 기본 문자예요. 하루 한 행(5글자)씩 외워보세요.'
                : kind === 'katakana'
                ? '가타카나는 외래어·이름 표기에 쓰여요. コーヒー(커피)처럼 익숙한 단어부터 시작해보세요.'
                : 'シ와ツ, ソ와ン처럼 헷갈리는 글자는 섞어서 퀴즈를 풀어야 확실히 구분돼요.'}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

  'convo|黄色いシャツ着た無口な男','convo|オッチョンジ惹かれる','convo|オッチョンジ好きなの',
  'convo|男らしくて笑顔がやさしい','convo|夢にまで見るわたし変なの',
  'convo|ああやるせないこの胸のうち','convo|あああの人は知ってか知らずか','convo|彼に惹かれる。',
  'convo|あかい葉っぱがひらひらと','convo|秋の風にゆれている',
  'convo|ゆっくり歩けば見えてくる','convo|小さな秋のしあわせが',
  'grammar|～はしない','grammar|동사 연용형 (중지법)','grammar|～てか～ずか','grammar|～とあれば',
]);
function cardLevel(type, front) { return LIT_CARDS.has(type + '|' + front) ? 'lit' : 'core'; }

function deckNotes(d) {
  const out = [];
  TYPE_KEYS.forEach(t => (d[t] || []).forEach(r => {
    const n = makeNote(t, r[0], r[1], r[2], r[3] || '');
    n.deck = d.id;
    n.lv = cardLevel(t, r[0]);
    out.push(n);
  }));
  return out;
}

/* exact card -> deck id, so notes saved before decks existed get tagged */
function deckKey(type, front, extra) { return type + '|' + front + '|' + (extra || ''); }
const DECK_INDEX = (() => {
  const m = {};
  STUDY_DECKS.forEach(d => TYPE_KEYS.forEach(t =>
    (d[t] || []).forEach(r => { m[deckKey(t, r[0], r[3] || '')] = d.id; })));
  return m;
})();
function backfillDecks(notes) {
  if (!notes || !notes.some(n => n.deck === undefined || n.lv === undefined)) return notes;
  return notes.map(n => {
    const next = { ...n };
    if (next.deck === undefined) next.deck = DECK_INDEX[deckKey(n.type, n.front, n.extra)] || '';
    if (next.lv === undefined) next.lv = cardLevel(n.type, n.front);
    return next;
  });
}
function deckCount(d) {
  return TYPE_KEYS.reduce((n, t) => n + ((d[t] || []).length), 0);
}

/* ── Lessons: 수업(날짜)별 ─────────────────────────────────────────────── */
function fmtLessonDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const dow = ['일','월','화','수','목','금','토'][new Date(y, m - 1, d).getDay()];
  return `${m}월 ${d}일 (${dow})`;
}

function LessonsView({ notes, loaded, onLoad, onPick, onBack }) {
  const groups = [];
  STUDY_DECKS.forEach(d => {
    const g = groups.find(x => x.date === d.date);
    if (g) g.decks.push(d); else groups.push({ date:d.date, decks:[d] });
  });
  groups.sort((a, b) => {
    if (!a.date) return -1;
    if (!b.date) return 1;
    return b.date.localeCompare(a.date);
  });

  const stats = (id) => {
    const ns = notes.filter(n => n.deck === id);
    return { total: ns.length, done: ns.filter(n => (n.box || 1) >= MAX_BOX).length };
  };
  const rest = STUDY_DECKS.filter(d => !loaded.includes(d.id));

  return (
    <div className="content">
      <BackBar onBack={onBack}
        right={<span className="fc-count">{loaded.length} / {STUDY_DECKS.length} 수업</span>} />

      <div className="tip-card" style={{marginBottom:16}}>

        </div>
      </div>

      {groups.map(g => (
        <div key={g.date} style={{marginBottom:18}}>

            <span className="lesson-dot" />
            {g.date ? fmtLessonDate(g.date) : '기초 필수 · 날짜 무관'}
          </div>

          {g.decks.map(d => {
            const has = loaded.includes(d.id);
            const st = stats(d.id);
            const pct = st.total ? Math.round(st.done / st.total * 100) : 0;
            return (
              <div className="card" key={d.id} style={{padding:16, marginBottom:8}}>
                <div style={{display:'flex', gap:10, alignItems:'flex-start', marginBottom:10}}>
                  <div style={{minWidth:0, flex:1}}>
                    <div className="note-front" style={{fontSize:17}}>{d.name}</div>
                    <div className="note-read" style={{marginTop:3}}>{d.sub}</div>
                  </div>
                  <span className="stat-pill" style={{flexShrink:0}}>{deckCount(d)}장</span>
                </div>

                <div className="pill-row" style={{marginBottom:has ? 12 : 14}}>
                  {TYPE_KEYS.filter(t => (d[t] || []).length).map(t => (
                    <span className="stat-pill" key={t}>
                      <span style={{fontFamily:'Georgia,serif'}}>{NOTE_TYPES[t].mark}</span>
                      {NOTE_TYPES[t].label} {d[t].length}

                  ))}

                {has && (
                  <div style={{marginBottom:12}}>
                    <div style={{display:'flex', justifyContent:'space-between', marginBottom:5}}>
                      <span style={{fontSize:11.5, color:'var(--ink-3)', fontWeight:600}}>숙련도</span>
                      <span style={{fontSize:11.5, color:'var(--rose)', fontWeight:700, fontVariantNumeric:'tabular-nums'}}>
                        {st.done} / {st.total}

                  </div>
                )}

function ReviewChoice({ pool, grade, onFinish, onBack }) {

      else { setRight(r); setI(i + 1); setSel(null); }

/* ── Mode: 짝 맞추기 ───────────────────────────────────────────────────── */
function ReviewMatch({ pool, grade, onFinish, onBack }) {
  const [pairs] = useState(() => studyOrder(pool).slice(0, Math.min(5, pool.length)));
  const [ja] = useState(() => shuffle(pairs));
  const [ko] = useState(() => shuffle(pairs));
  const [selJa, setSelJa] = useState(null);
  const [selKo, setSelKo] = useState(null);
  const [done, setDone] = useState([]);
  const [bad, setBad] = useState(false);
  const [tries, setTries] = useState(0);
  const [secs, setSecs] = useState(0);
  const timer = useTimeoutRef();

  useEffect(() => {
    const t = setInterval(() => setSecs(s => s + 1), 1000);
    return () => clearInterval(t);
  }, []);

  const resolve = (jId, kId) => {
    setTries(t => t + 1);
    if (jId === kId) {
      grade(jId, true);
      const nd = [...done, jId];
      setDone(nd);
      setSelJa(null); setSelKo(null);
      if (nd.length >= pairs.length) {
        timer.current = setTimeout(() => onFinish({ right:pairs.length, total:pairs.length, secs, tries:tries + 1 }), 500);
      }
    } else {
      grade(jId, false);
      setBad(true);
      timer.current = setTimeout(() => { setBad(false); setSelJa(null); setSelKo(null); }, 550);
    }
  };

  const tapJa = (id) => {
    if (bad || done.includes(id)) return;
    if (selKo) resolve(id, selKo); else setSelJa(selJa === id ? null : id);
  };
  const tapKo = (id) => {
    if (bad || done.includes(id)) return;
    if (selJa) resolve(selJa, id); else setSelKo(selKo === id ? null : id);
  };

  const cls = (id, sel) =>
    'match-tile' + (done.includes(id) ? ' done' : '') +
    (bad && sel === id ? ' bad shake' : (sel === id ? ' sel' : ''));

  return (
    <div className="content">
      <BackBar onBack={onBack} right={
        <span className="fc-count">{done.length} / {pairs.length} · {secs}초</span>
      } />
      <div className="tip-card" style={{marginBottom:12}}>
        <div className="tip-text">왼쪽 일본어와 오른쪽 뜻을 하나씩 눌러 짝을 맞춰 보세요.</div>
      </div>

      <div style={{display:'flex', gap:7}}>
        <div style={{flex:1, display:'flex', flexDirection:'column', gap:7}}>
          {ja.map(n => (
            <button key={n.id} className={cls(n.id, selJa) + ' ja'} onClick={() => tapJa(n.id)}>
              {n.front}
            </button>
          ))}
        </div>
        <div style={{flex:1, display:'flex', flexDirection:'column', gap:7}}>
          {ko.map(n => (
            <button key={n.id} className={cls(n.id, selKo)} onClick={() => tapKo(n.id)}>
              {n.back}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

        <div style={{fontSize:13, color:'var(--ink-3)', margin:'16px 0 24px', lineHeight:1.6}}>{msg}</div>
        <div style={{display:'flex', gap:8}}>
          <button className="btn btn-ghost" style={{flex:1, padding:14}} onClick={onHome}>노트로</button>
          <button className="btn btn-ghost-rose" style={{flex:1, padding:14}} onClick={onRetry}>한 번 더</button>
        </div>
      </div>
    </div>
  );
}

/* ── Add screen ────────────────────────────────────────────────────────── */
function NotesAdd({ onAdd, onBack, showToast }) {
  const [type, setType] = useState('word');
  const [way, setWay] = useState('paste');
  const [text, setText] = useState('');
  const [f, setF] = useState(['','','','']);
  const fileRef = useRef(null);

  const preview = way === 'paste' ? parseNoteText(text, type) : [];

  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => setText(t => (t ? t + '\n' : '') + String(r.result || ''));
    r.onerror = () => showToast('파일을 읽지 못했어요');
    r.readAsText(file, 'utf-8');
    e.target.value = '';
  };

  const addManual = () => {
    if (!f[0].trim() || !f[2].trim()) { showToast('일본어와 뜻은 필수예요'); return; }
    onAdd([makeNote(type, f[0], f[1], f[2], f[3])]);
    setF(['','','','']);
  };

  const T = NOTE_TYPES[type];

  return (
    <div className="content">
      <BackBar onBack={onBack} right={null} />

      <div className="section-title">어떤 내용인가요</div>
      <div className="tabs" style={{marginBottom:14}}>
        {TYPE_KEYS.map(k => (
          <button key={k} className={`tab${type === k ? ' active' : ''}`} onClick={() => setType(k)}>
            <span style={{fontFamily:'Georgia,serif', marginRight:4}}>{NOTE_TYPES[k].mark}</span>
            {NOTE_TYPES[k].label}
          </button>
        ))}
      </div>

      <div className="toggle-wrap">
        <button className={`toggle-btn${way === 'paste' ? ' active' : ''}`} onClick={() => setWay('paste')}>붙여넣기</button>
        <button className={`toggle-btn${way === 'one' ? ' active' : ''}`} onClick={() => setWay('one')}>하나씩 입력</button>
      </div>

      {way === 'paste' ? (
        <>
          <button className="file-btn" onClick={() => fileRef.current && fileRef.current.click()}>
            📄 파일 불러오기 (.txt · .csv)
          </button>
          <input ref={fileRef} type="file" accept=".txt,.csv,.tsv,text/plain" style={{display:'none'}} onChange={onFile} />

          <textarea className="ta" value={text} onChange={e => setText(e.target.value)}
            placeholder={`勉強 / べんきょう / 공부\n約束 / やくそく / 약속\n大切 / たいせつ / 소중함`} />

          <div className="tip-card" style={{margin:'10px 0'}}>
            <div className="tip-label">입력 형식</div>
            <div className="tip-text">
              한 줄에 하나씩, <strong>/</strong> 또는 쉼표·탭으로 구분해요.<br/>
              2칸이면 <em>{T.fields[0]} / {T.fields[2]}</em>,<br/>
              3칸이면 <em>{T.fields[0]} / {T.fields[1]} / {T.fields[2]}</em>,<br/>
              4칸이면 뒤에 <em>{T.fields[3]}</em>까지 들어가요.
            </div>
          </div>

          <button className="btn btn-primary" disabled={!preview.length} onClick={() => { onAdd(preview); setText(''); }}>
            {preview.length ? `${preview.length}개 노트에 추가` : '내용을 입력해 주세요'}
          </button>
        </>
      ) : (
        <>
          {T.fields.map((lab, k) => (
            <div className="field-group" key={k}>
              <label className="field-label">{lab}{(k === 0 || k === 2) ? ' *' : ''}</label>
              <input className="field-input" value={f[k]}
                onChange={e => setF(v => v.map((x, j) => j === k ? e.target.value : x))} />
            </div>
          ))}
          <button className="btn btn-primary" onClick={addManual}>노트에 추가</button>
        </>
      )}
    </div>
  );
}

/* ── Manage screen ─────────────────────────────────────────────────────── */
function NotesManage({ notes, onDel, onBack }) {
  const [type, setType] = useState('all');
  const list = type === 'all' ? notes : notes.filter(n => n.type === type);

  return (
    <div className="content">
      <BackBar onBack={onBack} right={<span className="fc-count">{list.length}장</span>} />

      <div className="tabs" style={{marginBottom:14}}>
        <button className={`tab${type === 'all' ? ' active' : ''}`} onClick={() => setType('all')}>전체</button>
        {TYPE_KEYS.map(k => (
          <button key={k} className={`tab${type === k ? ' active' : ''}`} onClick={() => setType(k)}>
            {NOTE_TYPES[k].label} {notes.filter(n => n.type === k).length}
          </button>
        ))}
      </div>

      {list.length === 0 ? (
        <div className="empty-wrap">
          <div className="empty-ja">空</div>
          <div className="empty-text">아직 저장된 내용이 없어요.</div>
        </div>
      ) : (
        <div className="card">
          {list.map(n => (
            <div className="note-li" key={n.id}>
              <div style={{minWidth:0, flex:1}}>
                <div className="note-front">
                  {n.front}
                  {n.lv === 'lit' && <span className="lit-tag">문학</span>}
                </div>
                {n.reading && <div className="note-read">{n.reading}</div>}
                <div className="note-back">{n.back}</div>
                {n.extra && <div className="note-read" style={{marginTop:3}}>{n.extra}</div>}
                <SrsDots box={n.box} />
              </div>
              <button className="note-del" onClick={() => onDel(n.id)} aria-label="삭제">✕</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── Notes tab (router) ────────────────────────────────────────────────── */
function NotesTab({ state, setState, showToast }) {
  const [view, setView] = useState('home');
  const [mode, setMode] = useState(null);
  const [scope, setScope] = useState('all');
  const [deckScope, setDeckScope] = useState('all');
  const [coreOnly, setCoreOnly] = useState(true);
  const [result, setResult] = useState(null);
  const [runId, setRunId] = useState(0);

  const notes = state.notes || [];
  /* derived from the notes themselves, so it can never desync or double-load */
  const loadedDecks = useMemo(() => {
    const seen = new Set(notes.map(n => n.deck).filter(Boolean));
    return STUDY_DECKS.filter(d => seen.has(d.id)).map(d => d.id);
  }, [notes]);
  const inScope = notes.filter(n =>
    (scope === 'all' || n.type === scope) &&
    (deckScope === 'all' || n.deck === deckScope));
  const litCount = inScope.filter(n => n.lv === 'lit').length;
  const pool = coreOnly ? inScope.filter(n => n.lv !== 'lit') : inScope;
  const lesson = deckScope === 'all' ? null : STUDY_DECKS.find(d => d.id === deckScope);
  const scopeLabel = [lesson && lesson.name, scope === 'all' ? '전체' : NOTE_TYPES[scope].label]
    .filter(Boolean).join(' · ');

  const addNotes = (list) => {
    if (!list || !list.length) { showToast('추가할 내용이 없어요'); return; }
    setState({ ...state, notes: [...notes, ...list] });
    showToast(`${list.length}개 추가 ✓`);
  };
  const delNote = (id) => setState({ ...state, notes: notes.filter(n => n.id !== id) });
  const loadDeck = (d) => {
    const list = Array.isArray(d) ? d : [d];
    const fresh = list.filter(x => !loadedDecks.includes(x.id));
    if (!fresh.length) return;
    const added = fresh.flatMap(deckNotes);
    setState({ ...state, notes: [...notes, ...added] });
    showToast(`${added.length}장 불러왔어요 ✓`);
  };
  const grade = (id, correct) =>
    setState({ ...state, notes: notes.map(n => n.id === id ? gradeNote(n, correct) : n) });

  const start = (m) => { setMode(m); setResult(null); setRunId(r => r + 1); setView('review'); };
  const home = () => { setView('home'); setMode(null); setResult(null); };
  const finish = (r) => { setResult(r); setView('result'); };

  if (view === 'decks')  return <LessonsView notes={notes} loaded={loadedDecks} onLoad={loadDeck}
                                   onPick={(id) => { setDeckScope(id); setScope('all'); home(); }}
                                   onBack={home} />;
  if (view === 'add')    return <NotesAdd onAdd={addNotes} onBack={home} showToast={showToast} />;
  if (view === 'manage') return <NotesManage notes={notes} onDel={delNote} onBack={home} />;
  if (view === 'result') return <ReviewResult result={result} onHome={home} onRetry={() => start(mode)} />;

  if (view === 'review') {
    const p = { key:runId, pool, grade, onFinish:finish, onBack:home };
    if (mode === 'flash')  return <ReviewFlash  {...p} />;
    if (mode === 'choice') return <ReviewChoice {...p} />;
    if (mode === 'type')   return <ReviewType   {...p} />;
    if (mode === 'match')  return <ReviewMatch  {...p} />;
    if (mode === 'couple') return <ReviewCouple key={runId} pool={pool} state={state} grade={grade} onBack={home} />;
  }

  /* ── home ── */
  if (!notes.length) {
    return (
      <div className="content">
        <div className="card">
          <div className="empty-wrap">
            <div className="empty-ja">筆</div>
            <div className="empty-text">
              배운 단어 · 한자 · 회화 · 문법을 올려두면<br/>
              5가지 방법으로 재미있게 복습할 수 있어요.
            </div>
            <button className="btn btn-primary" onClick={() => setView('decks')}>수업별 노트 불러오기</button>
            <button className="btn btn-ghost" style={{width:'100%', marginTop:8, padding:12}}
              onClick={() => setView('add')}>
              직접 내용 추가하기
            </button>
          </div>
        </div>
      </div>
    );
  }

  const shown = coreOnly ? notes.filter(n => n.lv !== 'lit') : notes;
  const weak = shown.filter(n => (n.box||1) < 3).length;
  const mastered = shown.filter(n => (n.box||1) >= MAX_BOX).length;

  return (
    <div className="content">
      <div className="pill-row">
        <span className="stat-pill">📚 전체 {shown.length}장</span>
        <span className="stat-pill">🔥 복습 필요 {weak}장</span>
        <span className="stat-pill">⭐ 완성 {mastered}장</span>
      </div>

      {lesson && (
        <button className="scope-all on" style={{marginBottom:12}} onClick={() => setDeckScope('all')}>
          📅 {lesson.date ? fmtLessonDate(lesson.date) + ' · ' : ''}{lesson.name} — 탭하면 전체로
        </button>
      )}

      <div className="section-title">무엇을 복습할까요</div>
      <div className="nt-grid">
        {TYPE_KEYS.map(k => {
          const c = notes.filter(n => n.type === k
            && (deckScope === 'all' || n.deck === deckScope)
            && (!coreOnly || n.lv !== 'lit')).length;
          return (
            <button key={k} className={`nt-card${scope === k ? ' on' : ''}`}
              onClick={() => setScope(scope === k ? 'all' : k)}>
              <span className="nt-mark">{NOTE_TYPES[k].mark}</span>
              <div className="nt-name">{NOTE_TYPES[k].label}</div>
              <div className="nt-count">{c}장</div>
            </button>
          );
        })}
      </div>
      <button className={`scope-all${scope === 'all' ? ' on' : ''}`}
        onClick={() => setScope('all')}>
        {scope === 'all' ? '✓ ' : ''}{lesson ? '이 수업' : '전체'} 모든 유형 함께 복습
      </button>

      {litCount > 0 && (
        <button className={`scope-all${coreOnly ? ' on' : ''}`} style={{marginBottom:16}}
          onClick={() => setCoreOnly(c => !c)}>
          {coreOnly
            ? `⭐ 실용 우선 · 가사·문학 표현 ${litCount}장 제외됨`
            : `📖 가사·문학 표현 ${litCount}장 포함 중`}
        </button>
      )}

      <div className="section-title">복습 방법 · {scopeLabel} {pool.length}장</div>
      {REVIEW_MODES.map(m => (
        <button key={m.id} className="mode-row" disabled={pool.length < m.min} onClick={() => start(m.id)}>
          <span className="mode-emoji">{m.emoji}</span>
          <span style={{minWidth:0}}>
            <span className="mode-name" style={{display:'block'}}>{m.name}</span>
            <span className="mode-desc" style={{display:'block'}}>
              {pool.length < m.min ? `${m.min}장 이상 필요해요` : m.desc}
            </span>
          </span>
          <span className="mode-arrow">›</span>
        </button>
      ))}

      <div style={{display:'flex', gap:8, marginTop:14}}>
        <button className="btn btn-ghost-rose" style={{flex:1, padding:13}} onClick={() => setView('add')}>+ 내용 추가</button>
        <button className="btn btn-ghost" style={{flex:1, padding:13}} onClick={() => setView('manage')}>목록 관리</button>
      </div>
      <button className="btn btn-ghost" style={{width:'100%', padding:13, marginTop:8}}
        onClick={() => setView('decks')}>
        📅 수업별 복습 {loadedDecks.length < STUDY_DECKS.length
          ? `· ${STUDY_DECKS.length - loadedDecks.length}개 수업 안 불러옴` : `· ${STUDY_DECKS.length}개 수업`}
      </button>
    </div>
  );
}

/* ── Main App ──────────────────────────────────────────────────────────── */
function App() {
  const [appState, setAppState] = useState(null);
  const [tab, setTab] = useState('home');
  const [toast, setToast] = useState('');

  useEffect(() => {
    const s = loadState();
    if (s?.p1 && s?.p2) setAppState({ ...s, notes: backfillDecks(s.notes || []) });
  }, []);

  const updateState = useCallback(next => { setAppState(next); saveState(next); }, []);

  const showToast = msg => {
    setToast(msg);
    setTimeout(() => setToast(''), 1800);
  };

  if (!appState?.p1) return (
    <SetupScreen onComplete={(p1, p2) => {
      updateState({ p1, p2, streak:1, learned:[], p1Learned:[], p2Learned:[], quizWins:0, hiragana:[], katakana:[], notes:[] });
    }} />
  );

  const tabs = [
    { id:'home',  icon:'🏠', label:'홈' },
    { id:'vocab', icon:'📖', label:'어휘' },
    { id:'notes', icon:'📝', label:'내 노트' },
    { id:'quiz',  icon:'⚔️',  label:'퀴즈' },
    { id:'kana',  icon:'あ',  label:'문자' },
  ];

  const HEADER_TITLES = {
    home:  { main:'우리 둘이', accent:'일본어' },
    vocab: { main:'어휘', accent:'학습' },
    notes: { main:'내', accent:'노트' },
    quiz:  { main:'퀴즈', accent:'배틀' },
    kana:  { main:'가나', accent:'あ ア' },
  };
  const ht = HEADER_TITLES[tab];

  return (
    <div className="app">
      <Toast msg={toast} />

      <header className="header">
        <div>
          <div className="header-title">{ht.main} <span>{ht.accent}</span></div>
          <div className="header-sub">{appState.p1} · {appState.p2}</div>
        </div>
        <div className="header-mark" style={{color:'var(--rose)'}}>
          <svg width="18" height="18" viewBox="0 0 96 96" fill="none">
            <circle cx="36" cy="48" r="28" stroke="currentColor" strokeWidth="4" opacity="0.25"/>
            <circle cx="60" cy="48" r="28" stroke="currentColor" strokeWidth="4" opacity="0.25"/>
          </svg>
        </div>
      </header>

      {tab==='home'     && <HomeTab     state={appState} setState={updateState} />}
      {tab==='vocab'    && <VocabTab    state={appState} setState={updateState} />}
      {tab==='notes'    && <NotesTab    state={appState} setState={updateState} showToast={showToast} />}
      {tab==='quiz'     && <QuizTab     state={appState} setState={updateState} showToast={showToast} />}
      {tab==='kana'     && <KanaTab     state={appState} setState={updateState} showToast={showToast} />}

      <nav className="nav">
        {tabs.map(t => (
          <button key={t.id} className={`nav-btn${tab===t.id?' active':''}`} onClick={() => setTab(t.id)}>
            <span className="nav-icon">{t.icon}</span>
            <span className="nav-label">{t.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
